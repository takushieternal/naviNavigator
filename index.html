<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navi Navigator · ALTTP Randomizer</title>
<style>
:root{
  --bg:#14121d; --panel:#231d31; --panel2:#2d2640; --ink:#0b0a12;
  --text:#ebe3cb; --dim:#9a91b5; --gold:#f4b41a; --green:#5fc861;
  --blue:#58a6e8; --red:#d4504a; --violet:#c084fc;
  --navi:#8be9fd; --navi2:#e3fbff;
}
*{box-sizing:border-box; margin:0; padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  background:var(--bg);
  background-image:repeating-conic-gradient(#16141f 0% 25%, #14121d 0% 50%);
  background-size:6px 6px;
  color:var(--text);
  font:12px/1.45 "Courier New", ui-monospace, Menlo, Consolas, monospace;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,textarea,select{font:inherit; color:inherit;}
h1,h2{text-transform:uppercase; letter-spacing:2px;}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 12px; background:var(--panel);
  border-bottom:4px solid var(--ink); flex:0 0 auto;
}
.brand{display:flex; align-items:center; gap:10px;}
.triforce{color:var(--gold); font-size:11px; line-height:.62; text-align:center; text-shadow:2px 2px 0 var(--ink); user-select:none;}
h1{font-size:16px; font-weight:900; text-shadow:2px 2px 0 var(--ink);}
.sub{font-size:10px; color:var(--dim); letter-spacing:1px;}
.stats{font-size:11px; letter-spacing:.5px; line-height:1.7;}
.stats b{color:var(--gold);} .stats .g{color:var(--green);} .stats .u{color:var(--dim);}
.stats .l{color:var(--blue);} .stats .d{color:var(--red);}
.hbtns{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
.save{font-size:10px; letter-spacing:1px; color:var(--green); width:100%; text-align:right;}
.save.warn{color:var(--gold);}

/* ---------- pixel buttons ---------- */
.btn{
  background:var(--panel2); border:3px solid var(--ink); cursor:pointer;
  padding:5px 10px; font-size:11px; font-weight:bold; text-transform:uppercase;
  letter-spacing:1px; box-shadow:3px 3px 0 var(--ink); color:var(--text);
}
.btn:hover{background:#3a3254;}
.btn:active{transform:translate(3px,3px); box-shadow:none;}
.btn:focus-visible{outline:2px dashed var(--gold); outline-offset:2px;}
.btn.gold{background:var(--gold); color:var(--ink);}
.btn.gold:hover{background:#ffc83d;}
.btn.danger{background:#5a2622;}
.btn.danger:hover{background:#7a332d;}
.btn.wide{width:100%; margin-top:8px;}

/* ---------- layout ---------- */
main{flex:1 1 auto; display:grid; grid-template-columns:292px 1fr 300px; min-height:0;}
.side, .logside{
  background:var(--panel); overflow-y:auto; padding:10px; min-height:0;
}
.side{border-right:4px solid var(--ink);}
.logside{border-left:4px solid var(--ink);}
.card{
  background:var(--panel2); border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink); padding:10px; margin-bottom:12px;
}
.card h2{font-size:11px; color:var(--gold); margin-bottom:8px;}
label{display:block; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:8px 0 3px;}
input[type=text], input:not([type]), textarea{
  width:100%; background:#171323; border:3px solid var(--ink);
  padding:6px 7px; font-size:12px; color:var(--text);
}
input:focus, textarea:focus{outline:none; border-color:var(--gold);}
textarea{resize:vertical;}
.ck{display:flex; align-items:center; gap:6px; cursor:pointer; margin-top:6px; color:var(--text); text-transform:none; font-size:11px;}
.ck input{accent-color:var(--gold);}
.row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.shake{animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- emulator link ---------- */
select{
  width:100%; background:#171323; border:3px solid var(--ink);
  padding:6px 7px; font-size:12px; color:var(--text); font:inherit;
}
select:focus{outline:none; border-color:var(--gold);}
.trkstat{display:flex; align-items:center; gap:7px; margin-top:9px; font-size:11px; color:var(--text);}
.lamp{width:10px; height:10px; flex:0 0 auto; background:#3a3450; border:2px solid var(--ink);}
.lamp.wait{background:var(--gold); animation:lampblink 1s steps(2) infinite;}
.lamp.ok{background:var(--green);}
.lamp.err{background:var(--red);}
@keyframes lampblink{50%{opacity:.25}}
.trklive{font-size:10px; color:var(--dim); margin-top:5px; min-height:12px; letter-spacing:.5px;}

/* ---------- trails & underworld atlas ---------- */
.trail{fill:none; stroke-linejoin:round; stroke-linecap:round; pointer-events:none;}
.tw-l{stroke:var(--gold); opacity:.45; stroke-width:2.4;}
.tw-d{stroke:var(--violet); opacity:.5; stroke-width:2.4;}
.apanel{fill:var(--panel); stroke:var(--ink); stroke-width:4;}
.aroom{fill:var(--panel2); stroke:var(--ink); stroke-width:2;}
.acell:hover .aroom{stroke:var(--gold);}
.atr-u{stroke:var(--text); opacity:.85; stroke-width:1.6;}
.atr-l{stroke:var(--dim); opacity:.85; stroke-width:1.5; stroke-dasharray:3 2;}
.albl{font-size:6.5px; fill:var(--dim); pointer-events:none;}
.afl{font-size:6.5px; fill:var(--gold); text-anchor:end; pointer-events:none;}
.aent{fill:var(--gold); stroke:var(--ink); stroke-width:1.5;}
.ahint{font-size:11px; fill:var(--dim); text-anchor:middle;}
.fogcell{fill:#04060e; opacity:.55; pointer-events:none;}
.fogct{font-size:11px; fill:var(--dim); text-anchor:end; letter-spacing:.08em;}
.mapimg{display:none; image-rendering:pixelated;}
.shotimg{display:none; image-rendering:pixelated;}
.fpimg{image-rendering:pixelated;}
.aroom.ov{fill-opacity:.16;}
#hereg{pointer-events:none;}
.herepos{transition:transform .16s linear;}
.herepos.snap{transition:none;}
.herek, .herepulse{transform-box:fill-box; transform-origin:center;}
.herew{fill:#fff; opacity:.9;}
.hereglow{fill:var(--navi); opacity:.35;}
.hereorb{fill:var(--navi2); stroke:var(--navi); stroke-width:1.4;}
.herepulse{fill:none; stroke:var(--navi); stroke-width:2; animation:herepulse 1.6s ease-out infinite;}
@keyframes herepulse{0%{transform:scale(.35); opacity:.9;}70%{opacity:.25;}100%{transform:scale(1.7); opacity:0;}}
.find{cursor:pointer; transition:opacity .15s;}
.findbg{fill:#0d0a16; stroke:var(--gold); stroke-width:1.4; opacity:.92;}
.findg{text-anchor:middle; pointer-events:none;}
#map.focus #finds .find{opacity:.13;}
#map.focus #finds .find.lit{opacity:1 !important;}
#pmap.focus #finds .find{opacity:.13;}
#pmap.focus #finds .find.lit{opacity:1 !important;}
body.skin-img .mapimg{display:inline;}
body.skin-photo .shotimg{display:inline;}
body.skin-img .tw-l, body.skin-photo .tw-l{stroke:#ffd76a; opacity:.8;}
body.skin-img .tw-d, body.skin-photo .tw-d{stroke:#f0a3ff; opacity:.85;}
body.skin-img .fogcell, body.skin-photo .fogcell{opacity:.62;}
.zoomui .btn.on{border-color:var(--gold); color:var(--gold);}
.adoor{stroke:var(--text); stroke-width:2.4; opacity:.95; stroke-linecap:round;}
.awarp{fill:none; stroke:var(--green); stroke-width:1.6; stroke-dasharray:4 3; opacity:.85;}
.awend{fill:var(--green); opacity:.9;}
.awg:hover .awarp{opacity:1; stroke-width:2.2;}
.aport path{stroke:var(--ink); stroke-width:1;}
.aport.pl path{fill:var(--gold);}
.aport.pd path{fill:#f0a3ff;}
.navi{width:36px; height:36px; flex:0 0 auto; animation:navibob 2.8s ease-in-out infinite;}
.navi .nw{fill:#fff; opacity:.85;}
.navi .nw2{opacity:.5;}
.navi .nglow{fill:var(--navi); opacity:.28;}
.navi .norb{fill:var(--navi2); stroke:var(--navi); stroke-width:1.6;}
@keyframes navibob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
header h1{color:var(--navi2); text-shadow:0 0 12px rgba(139,233,253,.5);}
.popmenu{position:absolute; top:44px; right:10px; display:flex; flex-direction:column; gap:4px;
  background:var(--panel); border:3px solid var(--ink); padding:6px; z-index:30;}
.popmenu .btn{text-align:left; white-space:nowrap;}
.thread{fill:none; stroke-width:1.8; opacity:.3; pointer-events:stroke; transition:opacity .15s, stroke-width .15s;}
.th-l{stroke:var(--gold);}
.th-d{stroke:#f0a3ff;}
.thread:hover, .thread.th-sel{opacity:.95; stroke-width:2.8;}
.ctxmenu{position:fixed; z-index:60; display:flex; flex-direction:column; gap:2px;
  background:var(--panel); border:3px solid var(--ink); padding:5px; min-width:180px;}
.ctxmenu .btn{text-align:left; white-space:nowrap;}
.ctxmenu .ctxh{font-size:10px; color:var(--navi); padding:3px 6px 1px; letter-spacing:.08em; text-transform:uppercase;}
.dot, .acell, .adoor, .awg, .aport, .lnk{transition:opacity .15s;}
#map.focus #dots .dot, #map.focus #threads .thread, #map.focus #atlasg .acell,
#map.focus #atlasg .adoor, #map.focus #atlasg .awg, #map.focus #atlasg .aport,
#map.focus #lnks path{opacity:.13;}
#map.focus #trails{opacity:.18;}
#map.focus .lit{opacity:1 !important;}
#map.focus .thread.lit{opacity:.95 !important; stroke-width:2.8;}
#map.linking{cursor:crosshair;}
#pmap.focus #dots .dot, #pmap.focus #threads .thread, #pmap.focus #atlasg .acell,
#pmap.focus #atlasg .adoor, #pmap.focus #atlasg .awg, #pmap.focus #atlasg .aport,
#pmap.focus #lnks path{opacity:.13;}
#pmap.focus #trails{opacity:.18;}
#pmap.focus .lit{opacity:1 !important;}
.igrid{display:grid; grid-template-columns:repeat(2, 1fr); gap:4px;}
.ichip{font-size:10.5px; padding:3px 5px; background:var(--panel2); border:2px solid var(--ink);
  opacity:.32; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ichip.on{opacity:1; border-color:var(--gold);}
.ln.noe{color:var(--gold); cursor:default;}
.tevt{color:var(--green);}

/* ---------- combo popups ---------- */
.cwrap{position:relative;}
.pop{
  position:absolute; left:0; right:0; top:100%; z-index:60;
  background:var(--panel); border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink); max-height:240px; overflow-y:auto;
}
.pop .grp{font-size:9px; color:var(--gold); letter-spacing:1px; text-transform:uppercase; padding:5px 8px 2px; background:#1b1626; position:sticky; top:0;}
.pop .it{display:block; width:100%; text-align:left; background:none; border:0; padding:5px 8px; cursor:pointer; font-size:11.5px;}
.pop .it .s{color:var(--dim); font-size:9.5px; margin-left:6px;}
.pop .it:hover, .pop .it.act{background:#3a3254;}

/* ---------- chips / legend ---------- */
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
.chip{background:#171323; border:2px solid var(--ink); padding:3px 7px; font-size:10px; cursor:pointer; text-transform:uppercase; letter-spacing:.5px; color:var(--dim);}
.chip.on{background:var(--gold); color:var(--ink); font-weight:bold;}
.legend div{display:flex; align-items:center; gap:8px; font-size:11px; margin:4px 0;}
.sw{width:13px; height:13px; border:2px solid var(--ink); display:inline-block; flex:0 0 auto;}
.sw.unknown{background:#9aa0b5;} .sw.done{background:var(--green);}
.sw.dungeon{background:var(--gold);} .sw.link{background:var(--blue);}
.sw.dead{background:var(--red);} .sw.drop{background:#3d3a52; border-radius:50%;}

/* ---------- map ---------- */
.maparea{position:relative; min-width:0; min-height:0; overflow:hidden;}
#map{width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
#map.adding{cursor:crosshair;}
#map:active{cursor:grabbing;}
.zoomui{position:absolute; top:10px; right:10px; display:flex; gap:5px;}
.zoomui .btn{padding:4px 8px;}
#tip{
  position:fixed; z-index:90; pointer-events:none; max-width:240px;
  background:var(--panel); border:3px solid var(--gold); padding:7px 9px;
  box-shadow:4px 4px 0 var(--ink); font-size:11px;
}
#tip .tn{font-weight:bold; color:var(--gold); text-transform:uppercase; letter-spacing:.5px;}
#tip .tm{color:var(--dim); font-size:9.5px; letter-spacing:1px;}
#tip .ta{margin-top:3px;}
#tip .tnote{color:var(--violet); margin-top:2px; font-style:italic;}

/* svg terrain */
.tbase{stroke:var(--ink); stroke-width:5;}
.tL .tbase{fill:#6d9a4d;} .tD .tbase{fill:#5d5070;}
.tL .tmnt{fill:#a8895f;} .tD .tmnt{fill:#6e5546;}
.tL .twood{fill:#3c6b38;} .tD .twood{fill:#352b4a;}
.tL .tlake{fill:#3f72ad;} .tD .tlake{fill:#2c4a72;}
.tL .tdes{fill:#cdb878;} .tD .tdes{fill:#93805b;}
.tL .tvil{fill:#84a55c;} .tD .tvil{fill:#6b5b78;}
.tL .triv{stroke:#3f72ad;} .tD .triv{stroke:#2c4a72;}
.triv{fill:none; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; opacity:.9;}
.tmnt,.twood,.tdes,.tvil{opacity:.92; stroke:rgba(11,10,18,.35); stroke-width:2;}
.tlbl{fill:rgba(10,9,16,.55); font-size:13px; font-weight:bold; letter-spacing:2px; text-anchor:middle; pointer-events:none;}
.ptitle{fill:var(--gold); font-size:22px; font-weight:900; letter-spacing:4px; text-anchor:middle; paint-order:stroke; stroke:var(--ink); stroke-width:5;}

/* svg dots */
.dot{cursor:pointer;}
.dot rect, .dot circle{stroke:var(--ink); stroke-width:2.5; transition:transform .12s; transform-box:fill-box; transform-origin:center;}
.dot:hover rect, .dot:hover circle{transform:scale(1.45); stroke:#fff;}
.dot.st-unknown rect{fill:#9aa0b5;} .dot.st-unknown circle{fill:#3d3a52;}
.dot.st-done rect, .dot.st-done circle{fill:var(--green);}
.dot.st-dungeon rect, .dot.st-dungeon circle{fill:var(--gold);}
.dot.st-link rect, .dot.st-link circle{fill:var(--blue);}
.dot.st-dead rect, .dot.st-dead circle{fill:var(--red);}
.dot.sel rect, .dot.sel circle{stroke:#fff; stroke-dasharray:3 2;}
.dot .nm{
  fill:#f5efdb; font-size:9px; text-anchor:middle; paint-order:stroke;
  stroke:var(--ink); stroke-width:2.5; display:none; pointer-events:none;
}
.dot .ord{
  fill:#fff; font-size:10px; font-weight:bold; text-anchor:middle;
  paint-order:stroke; stroke:var(--ink); stroke-width:2.5; display:none; pointer-events:none;
}
#map.show-names .dot .nm{display:block;}
#map.show-order .dot .ord.has{display:block;}
.dot.sel .nm, .dot.match .nm{display:block;}
.dot.dimmed{opacity:.18;}
.dot.fhide{display:none;}
.dot.match rect, .dot.match circle{animation:pulse 1s infinite;}
@keyframes pulse{50%{transform:scale(1.7);}}
.dot.flash rect, .dot.flash circle{animation:pulse .5s 2;}
.lnk{fill:none; stroke:var(--blue); stroke-width:3.5; opacity:.85;}
.lnk.x{stroke:var(--violet); stroke-dasharray:9 6;}

/* ---------- log ---------- */
.logside h2{font-size:11px; color:var(--gold); margin-bottom:8px;}
.lrow{
  background:var(--panel2); border:2px solid var(--ink); padding:5px 7px;
  margin-bottom:6px; font-size:11px; display:flex; flex-wrap:wrap; gap:4px 6px; align-items:baseline;
}
.lrow .ls{color:var(--gold); font-weight:bold;}
.lrow .ln{background:none; border:0; padding:0; cursor:pointer; color:var(--text); font-weight:bold; text-decoration:underline; text-underline-offset:2px;}
.lrow .ln:hover{color:var(--gold);}
.lrow .lx{color:var(--green);}
.lrow .lt{color:var(--dim); font-size:9.5px; margin-left:auto;}
.lrow .ld{background:none; border:0; cursor:pointer; color:var(--dim); padding:0 2px;}
.lrow .ld:hover{color:var(--red);}
.lempty{color:var(--dim); font-size:11px; padding:6px 2px;}

/* ---------- modal / toast ---------- */
#modal{position:fixed; inset:0; z-index:100; background:rgba(8,6,14,.78); display:flex; align-items:center; justify-content:center; padding:16px;}
.mbox{background:var(--panel); border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink); padding:16px; max-width:520px; width:100%; max-height:86vh; overflow-y:auto;}
.mbox h2{font-size:13px; color:var(--gold); margin-bottom:10px;}
.mbox p{margin:6px 0; font-size:12px;}
.mbox textarea{width:100%; height:180px; font-size:10.5px; margin-top:6px;}
.mbox .row{justify-content:flex-end;}
#toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:120;
  background:var(--gold); color:var(--ink); font-weight:bold; font-size:11px;
  letter-spacing:1px; text-transform:uppercase; padding:7px 14px;
  border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
}
kbd{background:#171323; border:2px solid var(--ink); padding:0 4px; font-size:10px;}

/* ---------- scrollbars / responsive ---------- */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--panel2); border:2px solid var(--ink);}
@media (max-width:1080px){
  body{overflow:auto;}
  main{display:flex; flex-direction:column;}
  .maparea{order:0; height:58vh; flex:0 0 auto; border-bottom:4px solid var(--ink);}
  .side{order:1; border-right:0; max-height:none;}
  .logside{order:2; border-left:0;}
  .save{text-align:left;}
}
@media (prefers-reduced-motion:reduce){
  .dot rect,.dot circle{transition:none;}
  .dot.match rect,.dot.match circle,.dot.flash rect,.dot.flash circle{animation:none;}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="navi" viewBox="0 0 26 26" aria-hidden="true">
      <ellipse class="nw" cx="7" cy="9" rx="6" ry="3.4" transform="rotate(-28 7 9)"/>
      <ellipse class="nw" cx="19" cy="9" rx="6" ry="3.4" transform="rotate(28 19 9)"/>
      <ellipse class="nw nw2" cx="8" cy="15" rx="4.6" ry="2.6" transform="rotate(-44 8 15)"/>
      <ellipse class="nw nw2" cx="18" cy="15" rx="4.6" ry="2.6" transform="rotate(44 18 15)"/>
      <circle class="nglow" cx="13" cy="13" r="8"/>
      <circle class="norb" cx="13" cy="13" r="4.6"/>
    </svg>
    <div>
      <h1>Navi Navigator</h1>
      <div class="sub">HEY! LISTEN! · ALTTP RANDOMIZER TRANSIT LOG</div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="hbtns">
    <button class="btn" id="bUndo" title="Ctrl+Z">⟲ Undo</button>
    <button class="btn" id="bCopy">Copy List</button>
    <button class="btn" id="bExport">Export</button>
    <button class="btn" id="bImport">Import</button>
    <button class="btn" id="bHelp">?</button>
    <button class="btn danger" id="bReset">Reset</button>
  </div>
  <div class="save" id="saveState"></div>
</header>

<main>
  <aside class="side">
    <section class="card">
      <h2>► Log a transition</h2>
      <label for="qAt">I went in at…</label>
      <div class="cwrap">
        <input id="qAt" placeholder="type an entrance…" autocomplete="off">
        <div class="pop" id="qAtPop" hidden></div>
      </div>
      <label for="qTo">…and found</label>
      <div class="cwrap">
        <input id="qTo" placeholder="a destination, or ⇆ other side…" autocomplete="off">
        <div class="pop" id="qToPop" hidden></div>
      </div>
      <button class="btn gold wide" id="bLog">Log it ▸</button>
    </section>

    <section class="card">
      <h2>► Emulator link</h2>
      <label for="tUrl">usb2snes / SNI websocket</label>
      <input id="tUrl" list="tUrlList" value="ws://localhost:23074" autocomplete="off" spellcheck="false">
      <datalist id="tUrlList">
        <option value="ws://localhost:23074">SNI</option>
        <option value="ws://localhost:8080">QUsb2Snes</option>
      </datalist>
      <div id="tDevRow" hidden>
        <label for="tDev">Device</label>
        <select id="tDev"></select>
      </div>
      <div class="trkstat"><span class="lamp" id="tLamp"></span><span id="tStatus">offline</span></div>
      <div class="trklive" id="tLive"></div>
      <div class="trklive tevt" id="tEvent"></div>
      <label class="ck"><input type="checkbox" id="ckAuto" checked> Auto-map as I play</label>
      <label class="ck"><input type="checkbox" id="ckFog" checked> Shade unexplored overworld</label>
      <button class="btn gold wide" id="tConnect">Connect</button>
    </section>

    <section class="card">
      <h2>► Items</h2>
      <div id="itemGrid" class="igrid"></div>
    </section>

    <section class="card">
      <h2>► Find &amp; filter</h2>
      <input id="search" placeholder="search the map…" autocomplete="off">
      <div class="chips" id="chips">
        <button class="chip on" data-f="all">All</button>
        <button class="chip" data-f="unknown">Unknown</button>
        <button class="chip" data-f="mapped">Mapped</button>
        <button class="chip" data-f="dungeon">Dungeons</button>
        <button class="chip" data-f="link">Connectors</button>
        <button class="chip" data-f="dead">Dead ends</button>
      </div>
      <label class="ck"><input type="checkbox" id="ckNames"> Show names</label>
      <label class="ck"><input type="checkbox" id="ckOrder"> Show visit order</label>
      <button class="btn wide" id="bAddPin">+ Custom pin</button>
    </section>

    <section class="card legend">
      <h2>► Legend</h2>
      <div><i class="sw unknown"></i> Unknown</div>

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function S(tag, attrs, parent){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function px(e){ return PANEL_X[e.w] + e.x/100*MAPW; }
function py(e){ return MAPT + e.y/100*MAPH; }
function timeStr(t){ const d = new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

   State
   ============================================================ */
let state = { assignments:{}, log:[], customs:[], seq:0, skin:'img', lock:true, paths:true, items:{}, finds:[], roomNames:{},
  trk:{ url:'', auto:true, fog:true }, atlas:{ ow:{ L:[], D:[] }, uw:{}, seen:{ L:{}, D:{} }, shot:{ L:{}, D:{} } } };
let selId = null;
let filter = 'all';
let adding = false;
let undoStack = [];
let byIdMap = {};

function ENTRANCES(){ return ENTR.concat(state.customs); }
function rebuildIndex(){
  byIdMap = {};
  for (const e of ENTRANCES()) byIdMap[e.id] = e;
}
function byId(id){ return byIdMap[id]; }
function nameOf(id){ const e = byId(id); return e ? e.n : id; }
function asg(id){ return state.assignments[id]; }
function ensureAsg(id){
  if (!state.assignments[id]) state.assignments[id] = { dest:'', link:'', deadEnd:false, note:'' };
  return state.assignments[id];
}
function statusOf(id){
  const a = asg(id);
  if (!a) return 'unknown';
  if (a.deadEnd) return 'dead';
  if (a.dest && DUNGEON_SET.has(a.dest)) return 'dungeon';
  if (a.link) return 'link';
  if (a.dest) return 'done';
  return 'unknown';
}
function pushUndo(){
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 60) undoStack.shift();
}
function undo(){
  if (!undoStack.length){ toast('Nothing to undo'); return; }
  state = JSON.parse(undoStack.pop());
  selId = null; hideDetail();
  rebuild(); save();
  toast('Undone');
}

function pts(arr){ return arr.map(p => (p[0]*MAPW/100).toFixed(1)+','+(p[1]*MAPH/100).toFixed(1)).join(' '); }

function buildTerrain(){
  const vp = $('vp');
  for (const w of ['L','D']){
    const g = S('g', { class: w==='L' ? 'tL' : 'tD', transform:`translate(${PANEL_X[w]} ${MAPT})` }, vp);
    S('rect', { class:'tbase', x:0, y:0, width:MAPW, height:MAPH }, g);
    S('polygon', { class:'twood', points: pts(TER.wood) }, g);
    S('polygon', { class:'tmnt',  points: pts(TER.mnt)  }, g);
    S('polygon', { class:'tdes',  points: pts(TER.des)  }, g);
    S('polygon', { class:'tvil',  points: pts(TER.vil)  }, g);
    S('ellipse', { class:'tlake', cx:TER.lake[0]*MAPW/100, cy:TER.lake[1]*MAPH/100, rx:TER.lake[2]*MAPW/100, ry:TER.lake[3]*MAPH/100 }, g);
    const rv = TER.river.map((p,i) => (i?'L ':'M ') + (p[0]*MAPW/100).toFixed(1)+' '+(p[1]*MAPH/100).toFixed(1)).join(' ');
    S('path', { class:'triv', d: rv }, g);

    // landmark glyph
    const cx = (w==='L'?50:51)*MAPW/100, cy = 45*MAPH/100;
    if (w === 'L'){
      const c = S('g', null, g);
      S('rect', { x:cx-26, y:cy-14, width:52, height:26, fill:'#b8b2c8', stroke:'#0b0a12', 'stroke-width':3 }, c);
      S('rect', { x:cx-36, y:cy-24, width:13, height:36, fill:'#cdc7da', stroke:'#0b0a12', 'stroke-width':3 }, c);
      S('rect', { x:cx+23, y:cy-24, width:13, height:36, fill:'#cdc7da', stroke:'#0b0a12', 'stroke-width':3 }, c);
      S('rect', { x:cx-6,  y:cy-2,  width:12, height:14, fill:'#0b0a12' }, c);
    } else {
      S('polygon', { points:`${cx},${cy-32} ${cx+36},${cy+12} ${cx-36},${cy+12}`, fill:'#8a79a8', stroke:'#0b0a12', 'stroke-width':3 }, g);
      S('rect', { x:cx-6, y:cy-2, width:12, height:14, fill:'#0b0a12' }, g);
    }
    for (const L of LBL[w]) S('text', { class:'tlbl', x:L[1]*MAPW/100, y:L[2]*MAPH/100 }, g).textContent = L[0];
    const im = S('image', { class:'mapimg', x:0, y:0, width:MAPW, height:MAPH, preserveAspectRatio:'none' }, g);
    const iu = w === 'L' ? 'images/map.png' : 'images/darkworld.png';
    im.setAttribute('href', iu);
    im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', iu);
    im.addEventListener('error', artFallback);
    S('image', { class:'shotimg', id:'shot' + w, x:0, y:0, width:MAPW, height:MAPH, preserveAspectRatio:'none' }, g);
    S('text', { class:'ptitle', x:MAPW/2, y:-22 }, g).textContent = (w==='L' ? '◐ LIGHT WORLD' : '◑ DARK WORLD');
  }
  // layers for trails, atlas, links + dots (world coordinates)
  S('g', { id:'fog' }, vp);
  S('g', { id:'atlasg' }, vp);
  S('g', { id:'trails' }, vp);
  S('g', { id:'threads' }, vp);
  S('g', { id:'finds' }, vp);
  S('g', { id:'lnks' }, vp);
  S('g', { id:'dots' }, vp);
  S('g', { id:'hereg', style:'display:none' }, vp);
}

/* ============================================================
   Dots
   ============================================================ */
function buildDots(){
  const gd = $('dots');
  gd.innerHTML = '';
  for (const e of ENTRANCES()){
    const g = S('g', { class:'dot', 'data-id':e.id, transform:`translate(${px(e).toFixed(1)} ${py(e).toFixed(1)})` }, gd);
    if (e.k === 'drop') S('circle', { r:6.5 }, g);
    else S('rect', { x:-6, y:-6, width:12, height:12 }, g);
    S('text', { class:'nm', y:-11 }, g).textContent = e.n;
    S('text', { class:'ord', y:21 }, g);
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      if (dragged || adding) return;
      if (linkFrom){ finishLink(e.id); return; }
      select(e.id);
      setFocus({ pins:[e.id] });
    });
    g.addEventListener('pointerenter', () => tipShow(e.id));
    g.addEventListener('pointerleave', tipHide);
  }
  updateDots();
}

function firstVisitMap(){
  const m = {};
  for (const L of state.log) if (!(L.e in m)) m[L.e] = L.s;
  return m;
}

function updateDots(){
  const q = $('search').value.trim().toLowerCase();
  const ord = firstVisitMap();
  for (const g of $('dots').children){
    const id = g.getAttribute('data-id');
    const e = byId(id); if (!e) continue;
    const st = statusOf(id);
    const a = asg(id);
    let cls = 'dot st-' + (st==='done' ? 'done' : st);
    if (st === 'done') cls = 'dot st-done';
    if (id === selId) cls += ' sel';
    // filter
    let vis = true;
    if (filter === 'unknown') vis = (st === 'unknown');
    else if (filter === 'mapped') vis = (st !== 'unknown');
    else if (filter === 'dungeon') vis = (st === 'dungeon');
    else if (filter === 'link') vis = !!(a && a.link);
    else if (filter === 'dead') vis = (st === 'dead');
    if (!vis) cls += ' fhide';
    // search
    if (q){
      const hay = (e.n + ' ' + e.r + ' ' + (a ? (a.dest+' '+a.note) : '')).toLowerCase();
      if (hay.includes(q)) cls += ' match';
      else cls += ' dimmed';
    }
    g.setAttribute('class', cls);
    const ot = g.querySelector('.ord');
    if (id in ord){ ot.textContent = '#'+ord[id]; ot.classList.add('has'); }
    else { ot.textContent = ''; ot.classList.remove('has'); }
  }
}

/* ============================================================
   Link threads
   ============================================================ */
function renderLinks(){
  const gl = $('lnks');
  gl.innerHTML = '';
  const seen = new Set();
  for (const id in state.assignments){
    const a = state.assignments[id];
    if (!a.link) continue;
    const o = a.link;
    const key = id < o ? id+'|'+o : o+'|'+id;
    if (seen.has(key)) continue;
    seen.add(key);
    const e1 = byId(id), e2 = byId(o);
    if (!e1 || !e2) continue;
    const x1 = px(e1), y1 = py(e1), x2 = px(e2), y2 = py(e2);
    const dx = x2-x1, dy = y2-y1;
    const dist = Math.hypot(dx, dy) || 1;
    const lift = Math.min(150, 28 + dist*0.16);
    // control point: midpoint pushed perpendicular (up-ish)
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const nx = -dy/dist, ny = dx/dist;
    const sgn = ny < 0 ? 1 : -1; // bias upward
    const cxp = mx + nx*lift*sgn, cyp = my + ny*lift*sgn;
    const cross = e1.w !== e2.w;
    S('path', { class: 'lnk' + (cross ? ' x' : ''), 'data-a':id, 'data-b':o, d:`M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${cxp.toFixed(1)} ${cyp.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}` }, gl);
  }
}

/* ============================================================
   Combos (autocomplete dropdowns)
   ============================================================ */
function makeCombo(inp, pop, getItems, onPick, opts){
  opts = opts || {};
  let items = [], act = -1;
  function render(){
    items = getItems(inp.value.trim());
    if (!items.length){ pop.hidden = true; return; }
    let html = '', lastG = null;
    items.forEach((it, i) => {
      if (it.g !== lastG){ html += '<div class="grp">'+esc(it.g)+'</div>'; lastG = it.g; }
      html += '<button type="button" class="it'+(i===act?' act':'')+'" data-i="'+i+'">'+esc(it.label)+
              (it.sub ? '<span class="s">'+esc(it.sub)+'</span>' : '')+'</button>';
    });
    pop.innerHTML = html;
    pop.hidden = false;
    const a = pop.querySelector('.it.act');
    if (a) a.scrollIntoView({ block:'nearest' });
  }
  function pick(it){
    pop.hidden = true; act = -1;
    onPick(it);
  }
  inp.addEventListener('input', () => { act = -1; render(); if (opts.onType) opts.onType(); });
  inp.addEventListener('focus', render);
  inp.addEventListener('blur', () => setTimeout(() => { pop.hidden = true; }, 160));
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown' && !pop.hidden){ act = Math.min(items.length-1, act+1); render(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp' && !pop.hidden){ act = Math.max(0, act-1); render(); ev.preventDefault(); }
    else if (ev.key === 'Enter'){
      if (!pop.hidden && items.length){ pick(items[act >= 0 ? act : 0]); ev.preventDefault(); }
      else if (opts.onEnter){ opts.onEnter(); ev.preventDefault(); }
    }
    else if (ev.key === 'Escape'){ pop.hidden = true; }
  });
  pop.addEventListener('pointerdown', ev => ev.preventDefault());
  pop.addEventListener('click', ev => {
    const b = ev.target.closest('.it');
    if (b) pick(items[+b.getAttribute('data-i')]);
  });
  return { hide: () => { pop.hidden = true; } };
}

function entItems(q, excludeId){
  const lq = q.toLowerCase();
  const out = [];
  for (const w of ['L','D']){
    let n = 0;
    for (const e of ENTRANCES()){
      if (e.w !== w || e.id === excludeId) continue;
      if (lq && !e.n.toLowerCase().includes(lq) && !e.r.toLowerCase().includes(lq)) continue;
      out.push({ g: w==='L' ? '◐ Light World' : '◑ Dark World', label: e.n,
                 sub: e.r + (e.k==='drop' ? ' · drop' : ''), pick: { type:'ent', id:e.id } });
      if (++n >= 9) break;
    }
  }
  return out;
}
function destItems(q, withLinks, excludeId){
  const lq = q.toLowerCase();
  const out = [];
  if (withLinks){
    let n = 0;
    for (const e of ENTRANCES()){
      if (e.id === excludeId) continue;
      if (lq && !e.n.toLowerCase().includes(lq)) continue;
      out.push({ g:'⇆ Connects through to…', label:'⇆ '+e.n,
                 sub:(e.w==='L'?'Light':'Dark')+' · '+e.r, pick:{ type:'link', id:e.id } });
      if (++n >= (lq ? 7 : 4)) break;
    }
  }
  let exact = false;
  for (const grp of DESTS){
    for (const d of grp.items){
      if (lq){
        if (!d.toLowerCase().includes(lq)) continue;
        if (d.toLowerCase() === lq) exact = true;
      }
      out.push({ g: grp.g, label: d, pick: { type:'dest', v:d } });
    }
  }
  if (q && !exact) out.push({ g:'Custom', label:'Use “'+q+'”', pick:{ type:'dest', v:q } });
  return out;
}
function resolveEntrance(text){
  const t = text.trim().toLowerCase();
  if (!t) return null;
  let hit = ENTRANCES().find(e => e.n.toLowerCase() === t);
  if (hit) return hit.id;
  const starts = ENTRANCES().filter(e => e.n.toLowerCase().startsWith(t));
  if (starts.length === 1) return starts[0].id;
  const inc = ENTRANCES().filter(e => e.n.toLowerCase().includes(t));
  if (inc.length === 1) return inc[0].id;
  return null;
}

/* ============================================================
   Pan / zoom (pointer events, pinch-friendly)
   ============================================================ */
const map = $('map'), vpEl = $('vp');
let view = { x:0, y:0, k:1 };
let dragged = false;
const pointers = new Map();
let pinchPrev = null;

function applyView(){
  vpEl.setAttribute('transform', `translate(${view.x.toFixed(2)} ${view.y.toFixed(2)}) scale(${view.k.toFixed(4)})`);
  hereScale();
}
function vbScale(){
  const r = map.getBoundingClientRect();
  return { r, s: Math.min(r.width/1720, r.height/815) };
}
function vbPoint(cx, cy){
  const { r, s } = vbScale();
  return { x: (cx - r.left - (r.width - 1720*s)/2) / s,
           y: (cy - r.top  - (r.height - 815*s)/2) / s };
}
function worldPoint(cx, cy){
  const p = vbPoint(cx, cy);
  return { x: (p.x - view.x)/view.k, y: (p.y - view.y)/view.k };
}
function zoomAtVB(p, f){
  const k2 = clamp(view.k * f, 0.35, 9);
  view.x = p.x - (p.x - view.x) * (k2/view.k);
  view.y = p.y - (p.y - view.y) * (k2/view.k);
  view.k = k2;
  applyView();
}
map.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomAtVB(vbPoint(ev.clientX, ev.clientY), ev.deltaY < 0 ? 1.18 : 1/1.18);
}, { passive:false });

map.addEventListener('pointerdown', ev => {
  map.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  dragged = false;
  pinchPrev = null;
  tipHide();
});
map.addEventListener('pointermove', ev => {
  if (!pointers.has(ev.pointerId)){
    if (!$('tip').hidden) tipMove(ev);
    return;
  }
  const prev = pointers.get(ev.pointerId);
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  const { s } = vbScale();
  if (pointers.size === 1){
    const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) dragged = true;
    if (dragged) lockBreak();
    view.x += dx / s; view.y += dy / s;
    applyView();
  } else if (pointers.size === 2){
    dragged = true;
    const pts2 = [...pointers.values()];
    const d = Math.hypot(pts2[0].x - pts2[1].x, pts2[0].y - pts2[1].y);
    const mid = { x:(pts2[0].x + pts2[1].x)/2, y:(pts2[0].y + pts2[1].y)/2 };
    if (pinchPrev){
      zoomAtVB(vbPoint(mid.x, mid.y), d / pinchPrev.d);
      view.x += (mid.x - pinchPrev.mid.x) / s;
      view.y += (mid.y - pinchPrev.mid.y) / s;
      applyView();
    }
    pinchPrev = { d, mid };
  }
});
function endPointer(ev){
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinchPrev = null;
  setTimeout(() => { dragged = false; }, 0);
}
map.addEventListener('pointerup', endPointer);
map.addEventListener('pointercancel', endPointer);

map.addEventListener('click', ev => {
  if (dragged) return;
  if (adding){ placePin(ev); return; }
  const fnd = ev.target.closest('.find');

/* ---- pop-out live map mirrors (second monitor / OBS window capture) ---- */
const POPS = [];
let popSeq = 1, popLast = 0, popTimer = null;
const POP_REGIONS = {
  all: { vb:[0, 0, 1720, 815],   w:1100, h:540, t:'Both Worlds' },
  L:   { vb:[15, 15, 800, 790],  w:660,  h:660, t:'Light World' },
  D:   { vb:[905, 15, 800, 790], w:660,  h:660, t:'Dark World' },
  U:   { vb:null,                w:720,  h:780, t:'Underworld Atlas' }
};
function popVB(region){
  if (region !== 'U') return POP_REGIONS[region].vb;
  const b = atlasVisitedBounds();
  return [b.x, b.y, b.w, b.h];
}
function popOut(region){
  const R = POP_REGIONS[region];
  let win = null;
  try { win = window.open('', 'navi_' + region, 'width=' + R.w + ',height=' + R.h); } catch (e) {}
  if (!win){ trkEvent('Hey! pop-up blocked — allow pop-ups for this page first'); return; }
  const doc = win.document;
  doc.title = 'Navi Navigator — ' + R.t;
  doc.head.innerHTML = '';
  const base = doc.createElement('base');
  base.href = location.href;
  doc.head.appendChild(base);
  const st = doc.createElement('style');
  st.textContent = ((document.querySelector('style') || {}).textContent || '') +
    '\nhtml,body{margin:0;height:100%;background:var(--bg,#14121d);overflow:hidden}svg{display:block;width:100vw;height:100vh}';
  doc.head.appendChild(st);
  doc.body.innerHTML = '<svg id="pmap" xmlns="http://www.w3.org/2000/svg" viewBox="' + popVB(region).join(' ') +
    '" preserveAspectRatio="xMidYMid meet"><g id="pvp"></g></svg>';
  const p = { win, region };
  POPS.push(p);
  popPaint(p);
  if (!popTimer) popTimer = setInterval(popTick, 800);
}
function popPaint(p){
  try {
    const doc = p.win.document;
    doc.body.className = document.body.className;
    const pm = doc.getElementById('pmap');
    if (pm) pm.classList.toggle('focus', map.classList.contains('focus'));
    const g = doc.getElementById('pvp');
    if (g) g.innerHTML = $('vp').innerHTML;
    if (p.region === 'U'){
      const sv = doc.getElementById('pmap');
      if (sv) sv.setAttribute('viewBox', popVB('U').join(' '));
    }
  } catch (e) {}
}
function popTick(){
  for (let i = POPS.length - 1; i >= 0; i--){
    if (!POPS[i].win || POPS[i].win.closed) POPS.splice(i, 1);
  }
  if (!POPS.length){ clearInterval(popTimer); popTimer = null; return; }
  if (popLast === popSeq) return;
  popLast = popSeq;
  for (const p of POPS) popPaint(p);
}

/* ---- left-click focus: spotlight everything connected ---- */
let FOCUS = null;
function setFocus(seed){
  FOCUS = seed && ((seed.pins && seed.pins.length) || (seed.rooms && seed.rooms.length)) ? seed : null;
  applyFocus();
  popSeq++;
}
function computeFocus(){
  if (!FOCUS) return null;
  const P = new Set(FOCUS.pins || []), R = new Set(FOCUS.rooms || []);
  const at = state.atlas || {}, uw = at.uw || {};
  for (const r of R){ for (const pt of ((uw[r] || {}).p || [])) P.add(pt.id); }
  for (const p of [...P]){ const a = asg(p); if (a && a.link) P.add(a.link); }
  for (const rk in uw){ for (const pt of (uw[rk].p || [])) if (P.has(pt.id)) R.add(+rk); }
  for (const p of P){ const a = asg(p); if (a && a.room != null) R.add(a.room); }
  const R2 = new Set(R);
  for (const e of (at.eg || [])){
    if (R.has(e.a) || R.has(e.b)){ R2.add(e.a); R2.add(e.b); }
  }
  return { P, R: R2 };
}
function applyFocus(){
  const F = computeFocus();
  map.classList.toggle('focus', !!F);
  const lit = (el, on) => el.classList.toggle('lit', !!on);
  for (const el of map.querySelectorAll('#dots .dot')) lit(el, F && F.P.has(el.getAttribute('data-id')));
  for (const el of map.querySelectorAll('#threads .thread')) lit(el, F && F.P.has(el.getAttribute('data-eid')));
  for (const el of map.querySelectorAll('#atlasg .acell')) lit(el, F && F.R.has(+el.getAttribute('data-room')));
  for (const el of map.querySelectorAll('#atlasg .aport')) lit(el, F && F.P.has(el.getAttribute('data-eid')));
  for (const el of map.querySelectorAll('#atlasg .adoor, #atlasg .awg'))
    lit(el, F && F.R.has(+el.getAttribute('data-a')) && F.R.has(+el.getAttribute('data-b')));
  for (const el of map.querySelectorAll('#lnks path'))
    lit(el, F && F.P.has(el.getAttribute('data-a')) && F.P.has(el.getAttribute('data-b')));
  for (const el of map.querySelectorAll('#finds .find'))
    lit(el, F && el.hasAttribute('data-room') && F.R.has(+el.getAttribute('data-room')));
}

function ctxShow(items, x, y){
  const m = $('ctxMenu');
  m.innerHTML = '';
  for (const it of items){
    if (it[0] === 'h'){
      const h = document.createElement('div');
      h.className = 'ctxh';

      m.appendChild(h);
      continue;
    }
    const b = document.createElement('button');
    b.className = 'btn';
    b.setAttribute('data-act', it[0]);
    b.textContent = it[2];
    b.addEventListener('click', ev2 => {
      ev2.stopPropagation();
      m.hidden = true;
      ctxRun(it[0], it[1]);

    m.appendChild(b);
  }
  m.hidden = false;
  m.style.left = Math.min(x, (window.innerWidth || 1200) - 210) + 'px';
  m.style.top = Math.min(y, (window.innerHeight || 800) - items.length*34 - 16) + 'px';
}
function ctxRun(act, arg){
  if (act === 'link'){ startLink(arg); return; }
  if (act === 'dead'){
    pushUndo();
    const a = ensureAsg(arg);
    a.deadEnd = !a.deadEnd;
    if (selId === arg) select(arg);
    refresh(); save();
    toast(a.deadEnd ? 'Marked dead end' : 'Dead end cleared');
    return;
  }
  if (act === 'note'){
    const t = window.prompt('Note for ' + nameOf(arg) + ':', '');
    if (!t) return;
    pushUndo();
    const a = ensureAsg(arg);
    a.note = a.note ? a.note + ' · ' + t : t;
    if (selId === arg) select(arg);
    refresh(); save();
    toast('Note added');
    return;
  }
  if (act === 'clear'){
    pushUndo();
    const a = asg(arg);
    if (a && a.link){ const o = asg(a.link); if (o && o.link === arg) delete o.link; }
    delete state.assignments[arg];
    if (selId === arg) select(arg);
    refresh(); save();
    toast('Pin cleared');
    return;
  }
  if (act === 'center'){ centerOn(arg); return; }
  if (act === 'rename'){
    const cur = (state.roomNames && state.roomNames[arg]) || ROOMS[arg] || '';
    const t = window.prompt('Name for room ' + hexw(arg) + ':', cur);
    if (t == null) return;
    pushUndo();
    state.roomNames = state.roomNames || {};
    if (t.trim()) state.roomNames[arg] = t.trim();
    else delete state.roomNames[arg];
    renderAtlas(); renderThreads(); applyFocus(); refresh(); save();
    toast('Room renamed');
    return;
  }
  if (act === 'zroom'){
    lockBreak();
    const c = atlasCellPt(arg, 256, 256);
    fitRect(c[0] - ATLAS.CS*2.5, c[1] - ATLAS.CS*2.5, ATLAS.CS*5, ATLAS.CS*5);
    return;
  }
  if (act === 'addpin'){ if (ctxEv) placePin(ctxEv); return; }
  if (act === 'zhere'){
    if (!ctxEv) return;
    lockBreak();
    const wpt = worldPoint(ctxEv.clientX, ctxEv.clientY);
    const k = Math.max(view.k, 2.2);
    view = { x: 860 - wpt.x*k, y: 407 - wpt.y*k, k };
    applyView();
    return;
  }
  if (act === 'zall'){ fitRect(0, 0, 1720, 815); return; }
}
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (linkFrom){ linkFrom = null; map.classList.remove('linking'); trkEvent(''); return; }
  const c = $('ctxMenu');
  if (c && !c.hidden){ c.hidden = true; return; }
  if (FOCUS) setFocus(null);
});

function centerOn(id){
  lockBreak();
  const e = byId(id); if (!e) return;
  const k = Math.max(view.k, 1.6);
  const tx = 860 - px(e)*k, ty = 407 - py(e)*k;
  const from = { x:view.x, y:view.y, k:view.k };
  const t0 = performance.now();
  function step(t){
    const u = Math.min(1, (t - t0)/240);
    const ease = u*(2-u);
    view.x = from.x + (tx - from.x)*ease;
    view.y = from.y + (ty - from.y)*ease;
    view.k = from.k + (k - from.k)*ease;
    applyView();
    if (u < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderStats(){

  const dgn = new Set();

  for (const e of all){
    const st = statusOf(e.id);
    if (st !== 'unknown') mapped++;

    '<b>'+mapped+'</b>/'+all.length+' mapped · ' +

    '⚑ <b>'+dgn.size+'</b>/14 dungeons · ' +
    '<span class="d">✖ '+dead+'</span> · ' +
    '<span class="u">'+(all.length - mapped)+' unknown</span>';
}

/* ============================================================
   Storage adapter  (artifact cloud → localStorage → memory)
   ============================================================ */
let backend = 'memory';
function detectBackend(){
  try {
    if (typeof window.storage === 'object' && window.storage &&
        typeof window.storage.get === 'function' && typeof window.storage.set === 'function'){
      backend = 'cloud'; return;
    }
  } catch (e) {}
  try {
    const t = '__alttp_t';
    localStorage.setItem(t, '1'); localStorage.removeItem(t);
    backend = 'local';
  } catch (e) { backend = 'memory'; }
}
async function storeLoad(){
  if (backend === 'cloud'){
    try {
      const r = await window.storage.get(KEY);
      if (r && r.value) return JSON.parse(r.value);
    } catch (e) {}
    return null;
  }
  if (backend === 'local'){
    try {
      const v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }
  return null;
}
async function storeSave(){
  const json = JSON.stringify(state);
  let ok = false;
  if (backend === 'cloud'){
    try { const r = await window.storage.set(KEY, json); ok = !!r; } catch (e) { ok = false; }
  } else if (backend === 'local'){
    try { localStorage.setItem(KEY, json); ok = true; } catch (e) { ok = false; }
  }
  paintSave(ok);
}
function paintSave(ok){
  const el = $('saveState');
  if (backend === 'memory'){
    el.textContent = '⚠ MEMORY ONLY — EXPORT TO KEEP YOUR MAP';
    el.classList.add('warn');
  } else if (ok === false){
    el.textContent = '⚠ SAVE FAILED — EXPORT AS BACKUP';
    el.classList.add('warn');
  } else {
    el.textContent = backend === 'cloud' ? '◆ SAVED · CLAUDE CLOUD' : '◆ SAVED · THIS BROWSER';
    el.classList.remove('warn');
  }
}
let saveTimer = null, savePending = false;
function save(){
  savePending = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { savePending = false; storeSave(); }, 600);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && savePending){ clearTimeout(saveTimer); savePending = false; storeSave(); }
});

/* ============================================================
   Auto-map atlas — traversal trails + stitched underworld
   The underworld really is one 16×19 grid of 512px supertiles;
   room id gives the cell (col = id & 0xF, row = id >> 4) and
   Link's coords masked to 511 give his spot inside it.
   ============================================================ */
const ATLAS = { CS:46, COLS:16, ROWS:19, X:496, Y:920 };

function ensureAtlas(){
  if (!state.atlas || typeof state.atlas !== 'object') state.atlas = {};
  const a = state.atlas;
  if (!a.ow || typeof a.ow !== 'object') a.ow = {};
  if (!Array.isArray(a.ow.L)) a.ow.L = [];
  if (!Array.isArray(a.ow.D)) a.ow.D = [];
  if (!a.uw || typeof a.uw !== 'object') a.uw = {};
  if (!a.seen || typeof a.seen !== 'object') a.seen = {};
  if (!a.seen.L || typeof a.seen.L !== 'object') a.seen.L = {};
  if (!a.seen.D || typeof a.seen.D !== 'object') a.seen.D = {};
  if (!a.shot || typeof a.shot !== 'object') a.shot = {};
  if (!a.shot.L || typeof a.shot.L !== 'object') a.shot.L = {};
  if (!a.shot.D || typeof a.shot.D !== 'object') a.shot.D = {};
  if (!Array.isArray(a.eg)) a.eg = [];
  return a;
}
function trailCount(segs){ let n = 0; for (const s of segs) n += s.length >> 1; return n; }
function trailThin(segs, budget){
  for (let i = 0; i < segs.length && trailCount(segs) > budget; i++){
    const s = segs[i];
    if (s.length <= 8) continue;
    const out = [];
    for (let j = 0; j < s.length - 2; j += 4) out.push(s[j], s[j+1]);
    out.push(s[s.length-2], s[s.length-1]);
    segs[i] = out;
  }
}
function trailPush(segs, x, y, minD, brk, budget){
  const s = segs[segs.length - 1];
  if (s && s.length >= 2){
    const d = Math.hypot(x - s[s.length-2], y - s[s.length-1]);
    if (d < minD) return false;
    if (d > brk) segs.push([x, y]);
    else s.push(x, y);
  } else segs.push([x, y]);
  trailThin(segs, budget);
  return true;
}

let atlasTimer = null;
function atlasDirty(){

  atlasTimer = setTimeout(() => { atlasTimer = null; renderTrails(); renderAtlas(); renderFog(); renderShots(); renderThreads(); renderFinds(); applyFocus(); popSeq++; }, 700);
}
function renderTrails(){

      S('polyline', { class:'trail ' + (w === 'L' ? 'tw-l' : 'tw-d'), points: pts }, g);
    }

}
/* ---- item find markers: icons where each item was picked up ---- */
function renderFinds(){

    } else {
      x = PANEL_X[f.w] + f.x/4096*MAPW;

/* ---- "you are here": live Navi at Link's position ---- */
let hereEls = null, hereLast = null;
function hereInit(){
  const hg = $('hereg');

  const k = S('g', { class:'herek' }, pos);

  S('ellipse', { class:'herew', cx:-4.5, cy:-3.5, rx:4.2, ry:2.3, transform:'rotate(-30 -4.5 -3.5)' }, k);
  S('ellipse', { class:'herew', cx:4.5, cy:-3.5, rx:4.2, ry:2.3, transform:'rotate(30 4.5 -3.5)' }, k);

function hereUpdate(s){

  let x = null, y = null;
  if (s.mod === 0x09 && s.ind === 0){
    const w = (s.area & 0x40) ? 'D' : 'L';
    x = PANEL_X[w] + s.x/4096*MAPW;
    y = MAPT + s.y/4096*MAPH;

    if (((s.room >> 4) & 0x1F) >= ATLAS.ROWS) return;
    const c = atlasCellPt(s.room, s.x & 511, s.y & 511);
    x = c[0]; y = c[1];
  } else if (s.mod <= 0x05 || s.mod === 0x12 || s.mod === 0x14 || s.mod === 0x17 || s.mod === 0x1B){
    hereHide();
    return;
  } else {
    return;   // transitional / menus: hold the last known spot
  }
  const moved = hereLast ? Math.hypot(x - hereLast.x, y - hereLast.y) : 1e9;
  const firstShow = hereEls.hg.style.display === 'none';
  hereEls.pos.classList.toggle('snap', moved > 60);
  hereEls.pos.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
  hereEls.hg.style.display = '';
  hereLast = { x, y };
  hereScale();
  if (lockActive()) lockFollow(x, y, moved > 60 || firstShow);
  if (moved > 2) popSeq++;
}
function hereHide(){
  if (hereEls) hereEls.hg.style.display = 'none';
  hereLast = null;
  lockTarget = null;
}
function hereScale(){
  if (!hereEls) return;
  const k = Math.max(0.45, Math.min(2.4, 1.15 / view.k));
  hereEls.k.style.transform = 'scale(' + k.toFixed(3) + ')';
}

/* ---- camera lock: follow the player at the user's zoom ---- */
let lockTarget = null, lockRaf = null;
function lockActive(){
  return state.lock !== false && trk.attached && !!hereLast;
}
function lockTick(){
  lockRaf = null;
  if (!lockActive() || !lockTarget) return;
  const tx = 860 - lockTarget.x*view.k, ty = 407 - lockTarget.y*view.k;
  const dx = tx - view.x, dy = ty - view.y;
  if (Math.abs(dx) + Math.abs(dy) < 0.5){
    view.x = tx; view.y = ty;
    applyView();
    return;
  }
  view.x += dx*0.16;
  view.y += dy*0.16;
  applyView();
  lockRaf = requestAnimationFrame(lockTick);
}
function lockFollow(x, y, snap){
  lockTarget = { x, y };
  if (!lockActive()) return;
  if (snap){
    view.x = 860 - x*view.k;
    view.y = 407 - y*view.k;
    applyView();
    return;
  }
  if (!lockRaf) lockRaf = requestAnimationFrame(lockTick);
}
function lockBreak(){
  if (state.lock === false) return;
  state.lock = false;
  applyLock();
  save();
}
function applyLock(){
  const b = $('zLock');
  if (b) b.classList.toggle('on', state.lock !== false);
  if (state.lock !== false && hereLast) lockFollow(hereLast.x, hereLast.y, true);
}
$('zLock').addEventListener('click', () => {
  state.lock = state.lock === false;
  applyLock();
  save();
});

/* ---- captured floorplan photos ($7F2000 tile attributes) ---- */
function shotBucket(b){
  if (b === 0x00) return 0;                                              // floor
  if (b <= 0x03) return 1;                                               // wall
  if (b === 0x08 || b === 0x09 || b === 0x0A) return 2;                  // water
  if ((b >= 0x1C && b <= 0x1F) || b === 0x22 || b === 0x26 || (b >= 0x30 && b <= 0x38)) return 3;  // stairs
  if (b === 0x20) return 4;                                              // pit
  if (b >= 0x28 && b <= 0x2F) return 5;                                  // ledge
  if (b >= 0x80) return 6;                                               // door / special
  return 7;                                                              // feature
}
const SHOT_PAL = {
  uw: ['#b3a47c','#181227','#2e6fb8','#f4b41a','#06050b','#857a58','#5fc861','#5d5375'],
  L:  ['#4e8f3e','#473722','#2e6fb8','#e0c060','#06050b','#3c6e30','#f4b41a','#6d5e3c'],
  D:  ['#97803f','#3a2b1d','#3c5f9e','#e0c060','#06050b','#74622f','#f0a3ff','#5c4a2e']
};
function shotEncode(buf){
  let out = '', run = 1, prev = shotBucket(buf[0]);
  for (let i = 1; i < buf.length; i++){
    const v = shotBucket(buf[i]);
    if (v === prev && run < 4095){ run++; continue; }
    out += run + String.fromCharCode(97 + prev);
    prev = v; run = 1;
  }
  return out + run + String.fromCharCode(97 + prev);
}
function shotDecode(rle){
  const out = new Uint8Array(4096);
  let i = 0;
  rle.replace(/(\d+)([a-h])/g, (mm, n, c) => {
    const v = c.charCodeAt(0) - 97;
    for (let k = 0; k < +n && i < 4096; k++) out[i++] = v;
    return '';
  });
  return out;
}
function shotPaint(cx, rle, pal, ox, oy){
  const data = shotDecode(rle);
  const img = cx.createImageData(64, 64);
  const cols = SHOT_PAL[pal].map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
  for (let i = 0; i < 4096; i++){
    const c = cols[data[i]];
    img.data[i*4] = c[0]; img.data[i*4+1] = c[1]; img.data[i*4+2] = c[2]; img.data[i*4+3] = 255;
  }
  cx.putImageData(img, ox, oy);
}
const SHOT_URLS = {};
function shotURL(rle, pal){
  const key = pal + '|' + rle;
  if (key in SHOT_URLS) return SHOT_URLS[key];
  let url = null;
  try {
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    const cx = cv.getContext && cv.getContext('2d');
    if (cx){ shotPaint(cx, rle, pal, 0, 0); url = cv.toDataURL(); }
  } catch (e) { url = null; }
  SHOT_URLS[key] = url;
  return url;
}
function setHref(el, u){
  el.setAttribute('href', u);
  el.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', u);
}
function renderShots(){
  const a = state.atlas;
  for (const w of ['L', 'D']){
    const el = $('shot' + w);
    if (!el) continue;
    const cells = a && a.shot ? a.shot[w] : null;
    const keys = cells ? Object.keys(cells) : [];
    if (!keys.length){ el.removeAttribute('href'); continue; }
    try {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const cx = cv.getContext && cv.getContext('2d');
      if (!cx) continue;
      cx.fillStyle = '#0c0a14';
      cx.fillRect(0, 0, 512, 512);
      for (const k of keys) shotPaint(cx, cells[k], w, (k & 7)*64, (k >> 3)*64);
      setHref(el, cv.toDataURL());
    } catch (e) {}
  }
}
function renderFog(){
  const g = $('fog'); if (!g) return;
  g.innerHTML = '';
  const ck = $('ckFog');
  if (ck && !ck.checked) return;
  const a = state.atlas;
  const seen = a && a.seen ? a.seen : null;
  if (!seen) return;
  const cw = MAPW/8, ch = MAPH/8;
  for (const w of ['L','D']){
    const sw = seen[w] || {};
    const n = Object.keys(sw).length;
    if (!n) continue;                       // an untouched world stays unfogged
    for (let cell = 0; cell < 64; cell++){
      if (sw[cell]) continue;
      S('rect', { class:'fogcell',
        x:(PANEL_X[w] + (cell & 7)*cw).toFixed(1), y:(MAPT + (cell >> 3)*ch).toFixed(1),
        width:cw.toFixed(1), height:ch.toFixed(1) }, g);
    }
    S('text', { class:'fogct', x:PANEL_X[w] + MAPW, y:MAPT - 22 }, g)
      .textContent = n + '/64 explored';
  }
}
function atlasCellPt(r, x, y){
  const sc = (ATLAS.CS - 6)/512;
  return [ATLAS.X + (r & 0x0F)*ATLAS.CS + 3 + x*sc,
          ATLAS.Y + ((r >> 4) & 0x1F)*ATLAS.CS + 3 + y*sc];
}
function renderThreads(){
  const g = $('threads'); if (!g) return;
  g.innerHTML = '';
  if (state.paths === false) return;
  const a = state.atlas; if (!a || !a.uw) return;
  for (const rk of Object.keys(a.uw)){
    const room = +rk;
    if (((room >> 4) & 0x1F) >= ATLAS.ROWS) continue;
    const R = a.uw[rk];
    for (const p of (R.p || [])){
      const e = byId(p.id); if (!e) continue;
      const x1 = px(e), y1 = py(e);
      const C = atlasCellPt(room, p.x, p.y);
      const dy = Math.max(90, (C[1] - y1)*0.42);
      const path = S('path', {
        class:'thread ' + (p.w === 'D' ? 'th-d' : 'th-l') + (selId === p.id ? ' th-sel' : ''),
        'data-eid': p.id,
        d:'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
          ' C' + x1.toFixed(1) + ' ' + (y1 + dy).toFixed(1) +
          ' ' + C[0].toFixed(1) + ' ' + (C[1] - dy).toFixed(1) +
          ' ' + C[0].toFixed(1) + ' ' + C[1].toFixed(1)
      }, g);
      S('title', null, path).textContent =
        nameOf(p.id) + ' ⇄ ' + (resolveInterior(room, (R.d != null ? R.d : 0xFF)) || hexw(room));
    }
  }
}
function threadSel(){

  for (const t of g.children) t.classList.toggle('th-sel', t.getAttribute('data-eid') === selId);
}
function applyPaths(){

}
$('zPath').addEventListener('click', () => {
  state.paths = state.paths === false;
  applyPaths();
  popSeq++;
  save();
});
const DGN_HUE = [210, 48, 110, 35, 268, 95, 285, 25, 322, 195, 48, 320, 14, 0];
function atlasVisitedBounds(){
  const a = state.atlas;
  const rooms = a && a.uw ? Object.keys(a.uw) : [];
  if (!rooms.length) return { x:ATLAS.X-30, y:ATLAS.Y-60, w:ATLAS.COLS*ATLAS.CS+60, h:200 };
  let c0 = 16, c1 = 0, r0 = 32, r1 = 0;
  for (const rk of rooms){
    const room = +rk, c = room & 0xF, r = (room >> 4) & 0x1F;
    if (r >= ATLAS.ROWS) continue;
    c0 = Math.min(c0, c); c1 = Math.max(c1, c);
    r0 = Math.min(r0, r); r1 = Math.max(r1, r);
  }
  const pad = ATLAS.CS;
  return { x: ATLAS.X + c0*ATLAS.CS - pad, y: ATLAS.Y + r0*ATLAS.CS - 60,
           w: (c1 - c0 + 1)*ATLAS.CS + pad*2, h: (r1 - r0 + 1)*ATLAS.CS + 60 + pad };
}
function renderAtlas(){
  const g = $('atlasg'); if (!g) return;
  g.innerHTML = '';
  const a = state.atlas;
  const rooms = a && a.uw ? Object.keys(a.uw).map(Number).filter(r => ((r >> 4) & 0x1F) < ATLAS.ROWS) : [];
  const W = ATLAS.COLS*ATLAS.CS;
  const rows = rooms.length ? Math.min(ATLAS.ROWS, Math.max(...rooms.map(r => (r >> 4) & 0x1F)) + 1) : 4;
  S('rect', { x:ATLAS.X-16, y:ATLAS.Y-52, width:W+32, height:rows*ATLAS.CS+72, class:'apanel' }, g);
  S('text', { class:'ptitle', 'text-anchor':'middle', x:ATLAS.X + W/2, y:ATLAS.Y-26 }, g).textContent = '▦ UNDERWORLD — AUTO-MAPPED';
  if (!rooms.length){
    S('text', { class:'ahint', x:ATLAS.X + W/2, y:ATLAS.Y + 46 }, g)
      .textContent = 'Hey! Listen! Connect the emulator and wander — every room you visit assembles here';
    return;
  }
  // entrance index: room → pin names
  const roomPins = {};
  for (const id in state.assignments){
    const r = state.assignments[id].room;
    if (r != null) (roomPins[r] = roomPins[r] || []).push(nameOf(id));
  }
  for (const room of rooms){
    const R = a.uw[room];
    const col = room & 0x0F, row = (room >> 4) & 0x1F;
    const x0 = ATLAS.X + col*ATLAS.CS, y0 = ATLAS.Y + row*ATLAS.CS;
    const cell = S('g', { class:'acell', 'data-room':room }, g);
    const fpu = R.fp ? shotURL(R.fp, 'uw') : null;
    if (fpu){
      const fim = S('image', { class:'fpimg', x:x0, y:y0, width:ATLAS.CS, height:ATLAS.CS, preserveAspectRatio:'none' }, cell);
      setHref(fim, fpu);
    }
    const attrs = { x:x0, y:y0, width:ATLAS.CS, height:ATLAS.CS, class:'aroom' + (fpu ? ' ov' : '') };
    if (R.d != null && R.d !== 0xFF) attrs.style = 'fill:hsl(' + DGN_HUE[(R.d >> 1) % 14] + ' 32% 26%)';
    S('rect', attrs, cell);
    const sc = (ATLAS.CS - 6)/512;
    for (const pair of [['u','atr-u'],['l','atr-l']]){
      for (const s of (R[pair[0]] || [])){
        if (s.length < 4) continue;
        let pts = '';
        for (let i = 0; i < s.length; i += 2)
          pts += (x0 + 3 + s[i]*sc).toFixed(1) + ',' + (y0 + 3 + s[i+1]*sc).toFixed(1) + ' ';
        S('polyline', { class:'trail ' + pair[1], points: pts }, cell);
      }
    }
    if (R.d !== 0xFF && R.d != null && R.f != null){
      const f = R.f > 0x7F ? 'B' + (0x100 - R.f) : (R.f + 1) + 'F';
      S('text', { class:'afl', x:x0 + ATLAS.CS - 3, y:y0 + 9 }, cell).textContent = f;
    }
    const nm = resolveInterior(room, R.d != null ? R.d : 0xFF) || hexw(room);
    S('text', { class:'albl', x:x0 + 2, y:y0 + ATLAS.CS - 3 }, cell)
      .textContent = nm.length > 10 ? nm.slice(0, 9) + '…' : nm;
    const ports = R.p || [];
    const ents = roomPins[room] || [];
    if (!ports.length && ents.length) S('circle', { class:'aent', cx:x0 + 6, cy:y0 + 7, r:3.2 }, cell);
    S('title', null, cell).textContent = nm + '  (' + hexw(room) + ')' +
      (ports.length ? '\n' + ports.map(p => (p.w === 'D' ? '◑ ' : '◐ ') + nameOf(p.id)).join('\n')
        : (ents.length ? '\nentrances: ' + ents.join(', ') : ''));
  }
  // room-to-room connections
  const sc2 = (ATLAS.CS - 6)/512;
  const inCell = (r, x, y) => [ATLAS.X + (r & 0x0F)*ATLAS.CS + 3 + x*sc2,
                               ATLAS.Y + ((r >> 4) & 0x1F)*ATLAS.CS + 3 + y*sc2];
  const vis = r => a.uw[r] && ((r >> 4) & 0x1F) < ATLAS.ROWS;
  for (const e of (a.eg || [])){
    if (!vis(e.a) || !vis(e.b)) continue;
    const A = inCell(e.a, e.ax, e.ay), B = inCell(e.b, e.bx, e.by);
    if (e.k === 'door'){
      S('line', { class:'adoor', 'data-a':e.a, 'data-b':e.b, x1:A[0].toFixed(1), y1:A[1].toFixed(1), x2:B[0].toFixed(1), y2:B[1].toFixed(1) }, g);
      continue;
    }
    const mx = (A[0] + B[0])/2, my = (A[1] + B[1])/2;
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1;
    const bow = Math.min(26, 8 + L*0.12);
    const wg = S('g', { class:'awg', 'data-a':e.a, 'data-b':e.b }, g);
    S('path', { class:'awarp', d:'M' + A[0].toFixed(1) + ' ' + A[1].toFixed(1) +
      ' Q' + (mx - dy/L*bow).toFixed(1) + ' ' + (my + dx/L*bow).toFixed(1) +
      ' ' + B[0].toFixed(1) + ' ' + B[1].toFixed(1) }, wg);
    S('circle', { class:'awend', cx:A[0].toFixed(1), cy:A[1].toFixed(1), r:2 }, wg);
    S('circle', { class:'awend', cx:B[0].toFixed(1), cy:B[1].toFixed(1), r:2 }, wg);
    S('title', null, wg).textContent =
      (resolveInterior(e.a, 0xFF) || hexw(e.a)) + ' ⇄ ' + (resolveInterior(e.b, 0xFF) || hexw(e.b)) + '  (stairs / drop / warp)';
  }
  // overworld portals on top
  for (const room of rooms){
    for (const p of (a.uw[room].p || [])){
      const P = inCell(room, p.x, p.y);
      const pg = S('g', { class:'aport ' + (p.w === 'D' ? 'pd' : 'pl'), 'data-eid':p.id }, g);
      S('path', { d:'M' + (P[0]-3.6).toFixed(1) + ' ' + (P[1]+3.1).toFixed(1) +
        ' L' + P[0].toFixed(1) + ' ' + (P[1]-4).toFixed(1) +
        ' L' + (P[0]+3.6).toFixed(1) + ' ' + (P[1]+3.1).toFixed(1) + ' Z' }, pg);
      S('title', null, pg).textContent = (p.w === 'D' ? 'Dark World: ' : 'Light World: ') + nameOf(p.id);
    }
  }
}
$('zU').addEventListener('click', () => {
