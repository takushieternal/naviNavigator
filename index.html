/* ============================================================
   Emulator link — auto-mapping via SNI / QUsb2Snes websocket
   Reads WRAM each ~95ms:
     $7E0010 module · $7E001B indoors · $7E0020/22 Link Y/X
     $7E008A OW area · $7E00A0 room · $7E00EE layer
     $7E020E dungeon floor · $7E040C dungeon idx
   ============================================================ */
const TRK_URLS = ['ws://localhost:23074', 'ws://localhost:8080'];

const trk = {
  ws:null, attached:false, devices:[], dev:'',
  pendBin:[], pendJson:[],
  phase:'boot', lastOW:null, lastUW:null, session:null,
  lastSample:null, itemBase:null, itick:0,
  shotReq:null, shotBusy:false, shotSkip:{},
  prevMod:-1, modStreak:0
};
let pumpToken = 0;

function hexw(v){ return '0x' + v.toString(16).toUpperCase().padStart(2,'0'); }
function trkStatus(txt, lamp){
  $('tStatus').textContent = txt;
  $('tLamp').className = 'lamp' + (lamp ? ' ' + lamp : '');
}
function trkLive(txt){ $('tLive').textContent = txt || ''; }
function trkEvent(txt){ $('tEvent').textContent = txt || ''; }

/* ---- usb2snes websocket plumbing ---- */
function trkSendRaw(op, operands){
  const msg = { Opcode:op, Space:'SNES' };
  if (operands) msg.Operands = operands;
  trk.ws.send(JSON.stringify(msg));
}
function trkJson(op, operands){
  return new Promise((res, rej) => {
    const p = { res, rej };
    p.timer = setTimeout(() => {
      const i = trk.pendJson.indexOf(p);
      if (i >= 0) trk.pendJson.splice(i, 1);
      rej(new Error(op + ' timed out'));
    }, 1500);
    trk.pendJson.push(p);
    try { trkSendRaw(op, operands); }
    catch (e) { clearTimeout(p.timer); trk.pendJson.pop(); rej(e); }
  });
}
function trkRead(addrHex, len){
  return new Promise((res, rej) => {
    const p = { need:len, got:0, chunks:[], res, rej };
    p.timer = setTimeout(() => {
      const i = trk.pendBin.indexOf(p);
      if (i >= 0) trk.pendBin.splice(i, 1);
      rej(new Error('read timed out'));
    }, 1500);
    trk.pendBin.push(p);
    try { trkSendRaw('GetAddress', [addrHex, len.toString(16)]); }
    catch (e) { clearTimeout(p.timer); trk.pendBin.pop(); rej(e); }
  });
}
function trkOnMessage(ev){
  if (typeof ev.data === 'string'){
    let j = null;
    try { j = JSON.parse(ev.data); } catch (e) {}
    const p = trk.pendJson.shift();
    if (p){ clearTimeout(p.timer); p.res(j && Array.isArray(j.Results) ? j.Results : []); }
    return;
  }
  const u = new Uint8Array(ev.data);
  const p = trk.pendBin[0];
  if (!p) return;
  p.chunks.push(u); p.got += u.length;
  if (p.got >= p.need){
    trk.pendBin.shift();
    clearTimeout(p.timer);
    const out = new Uint8Array(p.got);
    let o = 0;
    for (const c of p.chunks){ out.set(c, o); o += c.length; }
    p.res(out.subarray(0, p.need));
  }
}

/* ---- connect / attach ---- */
function trkToggle(){
  if (trk.ws){ trkDisconnect('offline'); return; }
  const url = ($('tUrl').value || '').trim() || TRK_URLS[0];
  state.trk.url = url; save();
  const alt = TRK_URLS.find(u => u !== url);
  trkConnect(TRK_URLS.includes(url) && alt ? [url, alt] : [url]);
}
function trkConnect(urls){
  const url = urls[0];
  trkStatus('connecting ' + url.replace('ws://','') + '…', 'wait');
  $('tConnect').textContent = 'Cancel';
  let ws = null;
  try { ws = new WebSocket(url); } catch (e) {}
  if (!ws){ trkConnectFailed(urls); return; }
  trk.ws = ws;
  let opened = false;
  try { ws.binaryType = 'arraybuffer'; } catch (e) {}
  ws.onmessage = trkOnMessage;
  ws.onopen = async () => {
    opened = true;
    $('tConnect').textContent = 'Disconnect';
    trkStatus('connected · listing devices…', 'wait');
    try { await trkRefreshDevices(true); }
    catch (e) { if (trk.ws === ws) trkDisconnect('no reply — is that really SNI / QUsb2Snes?'); }
  };
  ws.onclose = () => {
    if (trk.ws !== ws) return;
    if (!opened) trkConnectFailed(urls);
    else trkCleanup('connection dropped — press Connect to retry', 'err');
  };
  ws.onerror = () => {};
}
function trkConnectFailed(urls){
  trk.ws = null;
  const rest = urls.slice(1);
  if (rest.length){ trkConnect(rest); return; }
  trkCleanup('couldn\u2019t reach the server — start SNI / QUsb2Snes first. Inside claude.ai the sandbox may block localhost: download this file and open it in your browser.', 'err');
}
async function trkRefreshDevices(autoAttach){
  const res = await trkJson('DeviceList');
  if (!trk.ws) return;
  trk.devices = res || [];
  const sel = $('tDev');
  sel.innerHTML = '';
  for (const d of trk.devices){
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  }
  $('tDevRow').hidden = trk.devices.length === 0;
  if (!trk.devices.length){
    trkStatus('no devices — hook the emulator to SNI / QUsb2Snes, I\u2019ll keep looking…', 'wait');
    setTimeout(() => {
      if (trk.ws && !trk.attached) trkRefreshDevices(true).catch(() => {});
    }, 2000);
    return;
  }
  const want = trk.devices.includes(trk.dev) ? trk.dev : trk.devices[0];
  sel.value = want;
  if (autoAttach) await trkAttach(want);
}
async function trkAttach(dev){
  trk.dev = dev;
  trk.attached = false;
  pumpToken++;
  try { trkSendRaw('Attach', [dev]); } catch (e) { return; }
  let info = [];
  try { info = await trkJson('Info'); }
  catch (e) { trkStatus('couldn\u2019t attach — pick another device', 'err'); return; }
  if (!trk.ws) return;
  trk.attached = true;
  trk.phase = 'boot'; trk.lastOW = null; trk.lastUW = null; trk.session = null;
  trk.prevMod = -1; trk.modStreak = 0;
  const rom = info && info[2] ? ' · ' + String(info[2]).split(/[\\/]/).pop() : '';
  trkStatus('tracking ' + dev + rom, 'ok');
  trkEvent('');
  trkPump();
}

/* ---- poll pump ---- */
async function trkPump(){
  const tok = ++pumpToken;
  while (trk.ws && trk.attached && pumpToken === tok){
    let a, b;
    try {
      a = await trkRead('F50010', 0x200);
      b = await trkRead('F5040C', 1);
    } catch (e) {
      if (pumpToken === tok && trk.ws) trkDisconnect('lost the feed — press Connect to retry');
      return;
    }
    if (pumpToken !== tok) return;
    try { trkFeed(a, b); } catch (e) {}
    if ((trk.itick++ % 8) === 0){
      try {
        const ib = await trkRead('F5F340', 0x50);
        if (pumpToken === tok) trkItems(ib);
      } catch (e) {}
    }
    if (trk.shotReq && !trk.shotBusy){
      const req = trk.shotReq;
      trk.shotReq = null;
      trk.shotBusy = true;
      try {
        const sb = await trkRead('F62000', 0x1000);
        if (pumpToken === tok) trkShot(sb, req);
      } catch (e) {}
      trk.shotBusy = false;
    }
    await new Promise(r => setTimeout(r, 95));
  }
}

/* ---- sample + state machine ---- */
function trkFeed(a, b){
  const s = {
    mod:  a[0x00],
    ind:  a[0x0B],
    y:    a[0x10] | (a[0x11] << 8),
    x:    a[0x12] | (a[0x13] << 8),
    area: a[0x7A],
    room: a[0x90] | (a[0x91] << 8),
    lyr:  a[0xDE],
    fl:   a[0x1FE],
    dgn:  b[0]
  };
  trk.lastSample = s;
  if (s.mod === trk.prevMod) trk.modStreak++;
  else { trk.prevMod = s.mod; trk.modStreak = 1; }
  trkPaintLive(s);
  if (trk.modStreak < 2) return;             // resist transition + glitched reads
  const m = s.mod;
  if (m <= 0x05 || m === 0x14 || m === 0x17 || m === 0x1B){
    trk.phase = 'boot'; trk.session = null; trk.lastOW = null; trk.lastUW = null; trk.itemBase = null; return;
  }
  if (m === 0x12){ trk.phase = 'other'; trk.session = null; trk.lastUW = null; return; }
  if (m === 0x09 && s.ind === 0){
    if (trk.phase === 'uw') trkExit(s);
    trk.lastOW = { w:(s.area & 0x40) ? 'D' : 'L', area:s.area, xp:s.x / 40.96, yp:s.y / 40.96 };
    trk.phase = 'ow';
    trkTrail(s);
    trkShotWant(s);
    return;
  }
  if (m === 0x07 && s.ind === 1){
    if (trk.phase !== 'uw'){ trk.lastUW = null; trkEntry(s); }
    else {
      if (trk.lastUW && trk.lastUW.room !== s.room) trkEdge(trk.lastUW, s);
      if (trk.session && !trk.session.rooms.has(s.room)){
        trk.session.rooms.add(s.room);
        if (!trk.session.interior){
          const nm = resolveInterior(s.room, s.dgn);
          if (nm){ trk.session.interior = nm; trkLateName(nm); }
        }
      }
    }
    trk.lastUW = { room:s.room, x:s.x & 511, y:s.y & 511, ax:s.x, ay:s.y };
    trk.phase = 'uw';
    trkTrail(s);
    trkShotWant(s);
    return;
  }
  if (m === 0x15){ trk.lastUW = null; return; }   // mirror warp: don't fake an edge
  if (m === 0x0B){
    if (trk.phase === 'uw' && trk.session){
      trkEvent('came out into a special area');
      trk.session = null; trk.lastUW = null;
    }
    trk.phase = 'other';
    return;
  }
  // 0x06, 0x08, 0x0E, 0x0F, 0x10, 0x11, 0x13, 0x15… : transitional, keep phase
}

/* ---- trail capture ---- */
function trkTrail(s){
  if (!$('ckAuto').checked) return;
  const a = ensureAtlas();
  let drew = false;
  if (s.mod === 0x09){
    const w = (s.area & 0x40) ? 'D' : 'L';
    drew = trailPush(a.ow[w], s.x, s.y, 12, 220, 2600);
    const fc = s.x >> 9, fr = s.y >> 9;
    if (fc < 8 && fr < 8 && !a.seen[w][(fr << 3) | fc]){ a.seen[w][(fr << 3) | fc] = 1; drew = true; }
  } else if (s.mod === 0x07){
    const R = a.uw[s.room] || (a.uw[s.room] = { u:[], l:[], d:null, f:null });
    if (s.dgn !== 0xFF){ R.d = s.dgn; R.f = s.fl; }
    else if (R.d == null) R.d = 0xFF;
    drew = trailPush(R[s.lyr ? 'l' : 'u'], s.x & 511, s.y & 511, 8, 140, 240);
  }
  if (drew){ atlasDirty(); save(); }
}

/* A doorway between rooms when coords stay continuous; stairs / drops /
   warps when Link teleports. Deduped on quantized positions. */
function trkEdge(prev, s){
  if (!$('ckAuto').checked) return;
  const a = ensureAtlas();
  const far = Math.hypot(s.x - prev.ax, s.y - prev.ay) > 256;
  const k = far ? 'warp' : 'door';
  let r1 = prev.room, x1 = prev.x, y1 = prev.y, r2 = s.room, x2 = s.x & 511, y2 = s.y & 511;
  if (r2 < r1){ const t = [r1, x1, y1]; r1 = r2; x1 = x2; y1 = y2; r2 = t[0]; x2 = t[1]; y2 = t[2]; }
  const q = v => v >> 5;
  for (const e of a.eg){
    if (e.a === r1 && e.b === r2 && e.k === k &&
        q(e.ax) === q(x1) && q(e.ay) === q(y1) && q(e.bx) === q(x2) && q(e.by) === q(y2)) return;
  }
  if (a.eg.length > 600) a.eg.shift();
  a.eg.push({ a:r1, ax:x1, ay:y1, b:r2, bx:x2, by:y2, k });
  atlasDirty(); save();
}
function recPortal(room, x, y, pin){
  const a = ensureAtlas();
  const R = a.uw[room] || (a.uw[room] = { u:[], l:[], d:null, f:null });
  R.p = R.p || [];
  if (R.p.some(p => p.id === pin.id) || R.p.length > 7) return;
  R.p.push({ x, y, w:pin.w, id:pin.id });
  atlasDirty(); save();
}
function resolveInterior(room, dgn){
  if (state.roomNames && state.roomNames[room]) return state.roomNames[room];
  if (ROOMS[room]) return ROOMS[room];
  if (dgn !== 0xFF && (dgn & 1) === 0 && dgn <= 0x1A) return DGN_NAMES[dgn >> 1];
  return null;
}
function matchPin(ow){
  let best = null, second = null;
  for (const e of ENTRANCES()){
    if (e.w !== ow.w) continue;
    let d = Math.hypot(e.x - ow.xp, e.y - ow.yp);
    if (e.area != null && e.area === ow.area) d *= 0.5;
    if (!best || d < best.d){ second = best; best = { e, d }; }
    else if (!second || d < second.d) second = { e, d };
  }
  if (!best) return null;
  if (best.d > 9) return { pin:best.e, weak:true, ambig:false };
  return { pin:best.e, weak:false, ambig:!!(second && second.d < best.d * 1.4) };
}
function noteTag(a, tag){
  if (!(a.note || '').includes(tag)) a.note = (a.note ? a.note + ' · ' : '') + tag;
}

/* Entry: only undo/log when something is actually NEW.
   Repeat visits flash the pin and update the live line, nothing else. */
function trkEntry(s){
  const nm = resolveInterior(s.room, s.dgn);
  const m = trk.lastOW ? matchPin(trk.lastOW) : null;
  trk.session = {
    entryPinId: m ? m.pin.id : null,
    room: s.room,
    interior: nm,
    rooms: new Set([s.room])
  };
  if (!$('ckAuto').checked) return;
  const label = nm || ('Room ' + hexw(s.room));
  if (!m){ trkEvent('appeared in ' + label); return; }
  recPortal(s.room, s.x & 511, s.y & 511, m.pin);
  const a0 = asg(m.pin.id);
  const sawTag = '⚡ saw ' + label;
  const newDest = !a0 || !a0.dest;
  const newSaw  = a0 && a0.dest && a0.dest !== label && !a0.link && !(a0.note || '').includes(sawTag);
  const newFlag = (m.weak || m.ambig) && !((a0 && a0.note) || '').includes('⚡ check pin');
  if (!newDest && !newSaw && !newFlag){
    if (a0 && a0.room !== s.room){ a0.room = s.room; save(); }   // silent metadata
    flashDot(m.pin.id);
    trkEvent('back inside ' + nameOf(m.pin.id));
    return;
  }
  pushUndo();
  const a = ensureAsg(m.pin.id);
  a.room = s.room;
  if (newDest) a.dest = label;
  else if (newSaw) noteTag(a, sawTag);
  if (newFlag) noteTag(a, '⚡ check pin');
  state.seq++;
  state.log.push({ s:state.seq, t:Date.now(), e:m.pin.id, x:'⚡ → ' + label + (m.ambig ? ' ?' : '') });
  trkEvent('Hey! mapped ' + nameOf(m.pin.id) + ' → ' + label);
  if (selId === m.pin.id) select(selId);
  flashDot(m.pin.id);
  refresh(); save();
}
function trkLateName(nm){
  const sess = trk.session;
  if (!sess || !sess.entryPinId || !$('ckAuto').checked) return;
  const a = asg(sess.entryPinId);
  if (a && a.dest && a.dest.indexOf('Room 0x') === 0){
    a.dest = nm;
    trkEvent('Look! that was ' + nm);
    refresh(); save();
  }
}
/* Exit: same door = quiet feedback; new door = link the connector;
   spawned-inside exits only log the first time. */
function trkExit(s){
  const sess = trk.session;
  trk.session = null;
  const lu = trk.lastUW;
  trk.lastUW = null;
  if (!sess || !$('ckAuto').checked) return;
  const m = matchPin({ w:(s.area & 0x40) ? 'D' : 'L', area:s.area, xp:s.x / 40.96, yp:s.y / 40.96 });
  if (!m) return;
  if (lu) recPortal(lu.room, lu.x, lu.y, m.pin);
  const nm = sess.interior;
  if (sess.entryPinId && m.pin.id === sess.entryPinId){
    flashDot(m.pin.id);
    trkEvent('back outside at ' + nameOf(m.pin.id));
    return;
  }
  if (sess.entryPinId){
    const A0 = asg(sess.entryPinId);
    if (A0 && A0.link === m.pin.id){
      flashDot(m.pin.id);
      trkEvent('through ' + (nm || 'the connector') + ' again');
      return;
    }
    pushUndo();
    doLink(sess.entryPinId, m.pin.id);
    const A = ensureAsg(sess.entryPinId), B = ensureAsg(m.pin.id);
    if (nm){
      if (!A.dest || A.dest.indexOf('Room 0x') === 0) A.dest = nm;
      if (!B.dest || B.dest.indexOf('Room 0x') === 0) B.dest = nm;
    }
    if (B.room == null) B.room = sess.room;
    if (m.weak || m.ambig) noteTag(B, '⚡ check pin');
    state.seq++;
    state.log.push({ s:state.seq, t:Date.now(), e:sess.entryPinId,
      x:'⚡ ⇆ ' + nameOf(m.pin.id) + (nm ? ' (via ' + nm + ')' : '') });
    trkEvent('Listen! linked ' + nameOf(sess.entryPinId) + ' ⇆ ' + nameOf(m.pin.id));
    flashDot(m.pin.id); flashDot(sess.entryPinId);
    if (selId === sess.entryPinId || selId === m.pin.id) select(selId);
    refresh(); save();
    return;
  }
  // entered without a known pin (e.g. spawned indoors after S&Q)
  const B0 = asg(m.pin.id);
  const label = nm || ('Room ' + hexw(sess.room));
  if (B0 && B0.dest === label){
    flashDot(m.pin.id);
    trkEvent('back outside at ' + nameOf(m.pin.id));
    return;
  }
  pushUndo();
  const B = ensureAsg(m.pin.id);
  if (!B.dest) B.dest = label;
  if (B.room == null) B.room = sess.room;
  state.seq++;
  state.log.push({ s:state.seq, t:Date.now(), e:m.pin.id, x:'⚡ → ' + label + ' (exited here)' });
  trkEvent('Hey! mapped ' + nameOf(m.pin.id) + ' → ' + label);
  flashDot(m.pin.id);
  refresh(); save();
}
function trkPaintLive(s){
  if (!trk.attached) return;
  hereUpdate(s);
  if (s.mod === 0x09 || s.mod === 0x0B){
    trkLive('OW ' + hexw(s.area) + ' · ' + ((s.area & 0x40) ? 'DW' : 'LW') +
      ' · (' + (s.x / 40.96).toFixed(1) + ', ' + (s.y / 40.96).toFixed(1) + ')');
  } else if (s.mod === 0x07){
    const nm = resolveInterior(s.room, s.dgn);
    const fl = (s.dgn !== 0xFF) ? (s.fl > 0x7F ? ' · B' + (0x100 - s.fl) : ' · ' + (s.fl + 1) + 'F') : '';
    trkLive('inside ' + hexw(s.room) + (nm ? ' — ' + nm : '') + fl + (s.lyr ? ' · lower' : ''));
  } else if (s.mod <= 0x05){
    trkLive('title / file select');
  }
}

/* ---- floorplan capture: one $7F2000 read per new room / screen ---- */
function trkShotWant(s){
  if (!$('ckAuto').checked || trk.shotBusy || trk.shotReq || trk.modStreak < 3) return;
  const a = ensureAtlas();
  if (s.mod === 0x07){
    const R = a.uw[s.room];
    if (R && !R.fp && !trk.shotSkip['u' + s.room])
      trk.shotReq = { kind:'uw', room:s.room };
    return;
  }
  if (s.mod === 0x09){
    const lx = s.x & 511, ly = s.y & 511;
    if (lx < 64 || lx > 447 || ly < 64 || ly > 447) return;
    const fc = s.x >> 9, fr = s.y >> 9;
    if (fc > 7 || fr > 7) return;
    const w = (s.area & 0x40) ? 'D' : 'L';
    const cell = (fr << 3) | fc;
    if (!a.shot[w][cell] && !trk.shotSkip[w + cell])
      trk.shotReq = { kind:'ow', w, cell };
  }
}
function trkShot(buf, req){
  const s = trk.lastSample;
  if (!s) return;
  const hist = [0,0,0,0,0,0,0,0];
  for (let i = 0; i < 4096; i++) hist[shotBucket(buf[i])]++;
  const ok = hist[0] > 4096*0.08 && hist[0] < 4096*0.985 && (hist[1] + hist[4]) > 4096*0.01;
  const rle = ok ? shotEncode(buf) : null;
  if (req.kind === 'uw'){
    if (s.mod !== 0x07 || s.room !== req.room || !rle || rle.length > 6000){
      trk.shotSkip['u' + req.room] = 1;
      return;
    }
    const R = ensureAtlas().uw[req.room];
    if (R){ R.fp = rle; atlasDirty(); save(); }
    return;
  }
  const fc = s.x >> 9, fr = s.y >> 9;
  if (s.mod !== 0x09 || ((fr << 3) | fc) !== req.cell || ((s.area & 0x40) ? 'D' : 'L') !== req.w || !rle || rle.length > 6000){
    trk.shotSkip[req.w + req.cell] = 1;
    return;
  }
  ensureAtlas().shot[req.w][req.cell] = rle;
  atlasDirty(); save();
}

/* ---- item tracking: SRAM mirror $7EF340+ ---- */
const ITEM_FLAGS = [
  [0x02,'🪝','Hookshot','hook'], [0x05,'🔥','Fire Rod','frod'], [0x06,'❄️','Ice Rod','irod'],
  [0x07,'✴️','Bombos','bombos'], [0x08,'🌀','Ether','ether'], [0x09,'🌋','Quake','quake'],
  [0x0A,'🕯️','Lamp','lamp'], [0x0B,'🔨','Hammer','hammer'], [0x0D,'🦋','Bug Net','net'],
  [0x0E,'📖','Book of Mudora','book'], [0x10,'➕','Cane of Somaria','som'],
  [0x11,'✦','Cane of Byrna','byr'], [0x12,'🧥','Magic Cape','cape'],
  [0x15,'👢','Pegasus Boots','boots'], [0x16,'🐟','Flippers','flip'], [0x17,'🌙','Moon Pearl','pearl']
];
const ITEM_PROGS = [
  [0x00,'🏹','bow', {1:'Bow',2:'Bow & Arrows',3:'Silver Arrows',4:'Silver Arrows'},'Bow'],
  [0x01,'🪃','boom',{1:'Boomerang',2:'Magical Boomerang'},'Boomerang'],
  [0x04,'🍄','shroom',{1:'Mushroom',2:'Magic Powder'},'Mushroom'],
  [0x0C,'🪈','flute',{1:'Shovel',2:'Flute',3:'Flute'},'Shovel / Flute'],
  [0x13,'🪞','mirror',{1:'Magic Mirror',2:'Magic Mirror'},'Mirror'],
  [0x14,'🧤','glove',{1:'Power Glove',2:"Titan's Mitt"},'Gloves'],
  [0x19,'🗡️','sword',{1:'Fighter Sword',2:'Master Sword',3:'Tempered Sword',4:'Golden Sword'},'Sword'],
  [0x1A,'🛡️','shield',{1:'Fighter Shield',2:'Red Shield',3:'Mirror Shield'},'Shield'],
  [0x1B,'🎽','mail',{1:'Blue Mail',2:'Red Mail'},'Mail']
];
const ITEM_BITS = [
  [0x26,2,'🗝️','Big Key','bigkey'],
  [0x28,2,'🗺️','Dungeon Map','dmap'],
  [0x24,2,'🧭','Compass','compass'],
  [0x34,1,'🔻','Pendant','pend'],
  [0x3A,1,'💠','Crystal','cry']
];
function popcnt(v){ let n = 0; while (v){ n++; v &= v - 1; } return n; }
function itemLoc(){
  const s = trk.lastSample;
  if (!s) return '';
  if (s.mod === 0x07){
    const nm = resolveInterior(s.room, s.dgn) || ('Room ' + hexw(s.room));
    const fl = (s.dgn !== 0xFF) ? (s.fl > 0x7F ? ' B' + (0x100 - s.fl) : ' ' + (s.fl + 1) + 'F') : '';
    return nm + fl;
  }
  if (s.mod === 0x09 || s.mod === 0x0B){
    const w = (s.area & 0x40) ? 'Dark World' : 'Light World';
    const m = matchPin({ w:(s.area & 0x40) ? 'D' : 'L', area:s.area, xp:s.x / 40.96, yp:s.y / 40.96 });
    return (m && !m.weak) ? w + ' near ' + nameOf(m.pin.id) : w;
  }
  return '';
}
function itemCtxPin(){
  const s = trk.lastSample;
  if (!s) return null;
  if (s.mod === 0x07 && trk.session && trk.session.entryPinId) return trk.session.entryPinId;
  if (s.mod === 0x09){
    const m = matchPin({ w:(s.area & 0x40) ? 'D' : 'L', area:s.area, xp:s.x / 40.96, yp:s.y / 40.96 });
    if (m && !m.weak) return m.pin.id;
  }
  return null;
}
function trkItems(b){
  const m = trk.lastSample ? trk.lastSample.mod : 0;
  if (!(m === 0x07 || m === 0x09 || m === 0x0B || m === 0x0E || m === 0x0F || m === 0x10)) return;
  const cur = {};
  for (const f of ITEM_FLAGS) cur[f[3]] = b[f[0]];
  for (const f of ITEM_PROGS) cur[f[2]] = b[f[0]];
  for (const f of ITEM_BITS) cur[f[4]] = b[f[0]] | (f[1] > 1 ? b[f[0] + 1] << 8 : 0);
  let nb = 0;
  for (let i = 0x1C; i <= 0x1F; i++) if (b[i]) nb++;
  cur.bot = nb;
  cur.hp = b[0x2C]; cur.hq = b[0x2B]; cur.mg = b[0x3B];
  const base = trk.itemBase;
  trk.itemBase = cur;
  if (!base){ state.items = cur; renderItems(); save(); return; }
  const gains = [];
  for (const f of ITEM_FLAGS) if (cur[f[3]] > 0 && !(base[f[3]] > 0)) gains.push({ n:f[2], g:f[1] });
  for (const f of ITEM_PROGS) if (cur[f[2]] > (base[f[2]] || 0)) gains.push({ n:f[3][cur[f[2]]] || f[4], g:f[1] });
  for (const f of ITEM_BITS){
    let nw = cur[f[4]] & ~(base[f[4]] || 0);
    while (nw){ gains.push({ n:f[3], g:f[2] }); nw &= nw - 1; }
  }
  for (let i = (base.bot || 0); i < cur.bot; i++) gains.push({ n:'Bottle', g:'🧴' });
  if (cur.hq > (base.hq || 0)) gains.push({ n:'Piece of Heart', g:'❤️' });
  if (cur.hp - (base.hp || 0) >= 8) gains.push({ n:'Heart Container', g:'❤️' });
  if (cur.mg === 1 && !(base.mg > 0)) gains.push({ n:'Half Magic', g:'✨' });
  if (cur.mg === 2 && (base.mg || 0) < 2) gains.push({ n:'Quarter Magic', g:'✨' });
  state.items = cur;
  if (gains.length && $('ckAuto').checked){
    const loc = itemLoc(), pin = itemCtxPin();
    const s2 = trk.lastSample;
    let fan = 0;
    state.finds = state.finds || [];
    for (const gn of gains){
      state.seq++;
      state.log.push({ s:state.seq, t:Date.now(), e:pin, x:'⚡ ★ ' + gn.g + ' ' + gn.n + (loc ? ' — ' + loc : '') });
      if (s2 && state.finds.length < 400){
        if (s2.mod === 0x07){
          state.finds.push({ k:'u', room:s2.room, x:Math.min(500, (s2.x & 511) + fan*9), y:s2.y & 511, n:gn.n, g:gn.g });
          fan++;
        } else if (s2.mod === 0x09){
          state.finds.push({ k:'o', w:(s2.area & 0x40) ? 'D' : 'L', x:Math.min(4080, s2.x + fan*36), y:s2.y, n:gn.n, g:gn.g });
          fan++;
        }
      }
    }
    trkEvent('Hey! got ' + gains.map(gn => gn.n).join(', '));
    renderItems();
    renderFinds();
    refresh(); save();
    return;
  }
  renderItems(); save();
}
function renderItems(){
  const g = $('itemGrid'); if (!g) return;
  const it = state.items || {};
  const chip = (on, emo, label) =>
    '<div class="ichip' + (on ? ' on' : '') + '">' + emo + ' ' + esc(label) + '</div>';
  let h = '';
  for (const f of ITEM_PROGS){
    const v = it[f[2]] || 0;
    h += chip(v > 0, f[1], v > 0 ? (f[3][v] || f[4]) : f[4]);
  }
  for (const f of ITEM_FLAGS) h += chip((it[f[3]] || 0) > 0, f[1], f[2]);
  h += chip((it.bot || 0) > 0, '🧴', 'Bottles ×' + (it.bot || 0));
  h += chip((it.bigkey || 0) > 0, '🗝️', 'Big Keys ×' + popcnt(it.bigkey || 0));
  h += chip((it.dmap || 0) > 0, '🗺️', 'Maps ×' + popcnt(it.dmap || 0));
  h += chip((it.compass || 0) > 0, '🧭', 'Compasses ×' + popcnt(it.compass || 0));
  h += chip(popcnt(it.pend || 0) > 0, '🔻', 'Pendants ' + popcnt(it.pend || 0) + '/3');
  h += chip(popcnt(it.cry || 0) > 0, '💠', 'Crystals ' + popcnt(it.cry || 0) + '/7');
  h += chip(it.hp != null, '❤️', '♥ ' + Math.floor((it.hp || 24) / 8) + ((it.hq || 0) ? ' +' + it.hq + '/4' : ''));
  h += chip((it.mg || 0) > 0, '✨', (it.mg === 2) ? 'Quarter Magic' : 'Half Magic');
  g.innerHTML = h;
}

/* ---- teardown ---- */
function trkDisconnect(msg){
  const ws = trk.ws;
  trk.ws = null;
  if (ws){
    try { ws.onclose = null; ws.onmessage = null; ws.close(); } catch (e) {}
  }
  trkCleanup(msg, msg && msg !== 'offline' ? 'err' : '');
}
function trkCleanup(msg, lamp){
  pumpToken++;
  trk.ws = null; trk.attached = false; trk.devices = [];
  for (const p of trk.pendBin.splice(0)){ clearTimeout(p.timer); }
  for (const p of trk.pendJson.splice(0)){ clearTimeout(p.timer); }
  trk.session = null; trk.lastOW = null; trk.lastUW = null; trk.phase = 'boot';
  trk.lastSample = null; trk.itemBase = null; trk.itick = 0;
  trk.shotReq = null; trk.shotBusy = false;
  hereHide();
  trk.prevMod = -1; trk.modStreak = 0;
  $('tDevRow').hidden = true;
  $('tConnect').textContent = 'Connect';
  trkStatus(msg || 'offline', lamp || '');
  trkLive(''); trkEvent('');
}

$('tConnect').addEventListener('click', trkToggle);
$('tDev').addEventListener('change', () => {
  if (trk.ws) trkAttach($('tDev').value).catch(() => {});
});
$('ckAuto').addEventListener('change', () => {
  state.trk.auto = $('ckAuto').checked;
  save();
});
$('ckFog').addEventListener('change', () => {
  state.trk.fog = $('ckFog').checked;
  renderFog();
  save();
});

/* ============================================================
   Refresh / init
   ============================================================ */
function refresh(){
  popSeq++;
  threadSel();
  updateDots();
  renderLinks();
  renderLog();
  renderStats();
  applyFocus();
}
function rebuild(){
  rebuildIndex();
  buildDots();
  renderTrails();
  renderAtlas();
  renderFog();
  renderShots();
  renderThreads();
  renderFinds();
  renderItems();
  refresh();
}

(async function init(){
  detectBackend();
  rebuildIndex();
  buildTerrain();
  const saved = await storeLoad();
  if (saved && typeof saved === 'object' && saved.assignments){
    state = {
      assignments: saved.assignments || {},
      log: Array.isArray(saved.log) ? saved.log : [],
      customs: Array.isArray(saved.customs) ? saved.customs : [],
      seq: typeof saved.seq === 'number' ? saved.seq : 0,
      roomNames: (saved.roomNames && typeof saved.roomNames === 'object') ? saved.roomNames : {},
      skin: (saved.skin === 'photo' || saved.skin === 'draw' || saved.skin === 'img') ? saved.skin : (saved.art === false ? 'draw' : 'img'),
      lock: saved.lock !== false,
      paths: saved.paths !== false,
      items: (saved.items && typeof saved.items === 'object') ? saved.items : {},
      finds: Array.isArray(saved.finds) ? saved.finds : [],
      trk: (saved.trk && typeof saved.trk.url === 'string') ? { url: saved.trk.url, auto: saved.trk.auto !== false, fog: saved.trk.fog !== false } : { url:'', auto:true },
      atlas: (saved.atlas && typeof saved.atlas === 'object') ? saved.atlas : { ow:{ L:[], D:[] }, uw:{}, seen:{ L:{}, D:{} }, shot:{ L:{}, D:{} } }
    };
  }
  if (state.trk && state.trk.url) $('tUrl').value = state.trk.url;
  if (state.trk && state.trk.auto === false) $('ckAuto').checked = false;
  if (state.trk && state.trk.fog === false) $('ckFog').checked = false;
  applyArt();
  applyPaths();
  applyLock();
  ensureAtlas();
  rebuild();
  paintSave(backend === 'memory' ? false : true);
  if (window.innerWidth < 900) fitRect(15, 15, 800, 790);
  else fitRect(0, 0, 1720, 815);
  $('qAt').focus();
})();

</script>
